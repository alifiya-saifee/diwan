<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwan Inbox</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .wrap { height: calc(100vh - 56px); display: flex; flex-direction: column; }
  /* the top bar: title, the honest line status, who is viewing, the few things a broker opens */
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: rgba(10, 13, 19, .7); position: relative; }
  .bar .ttl { font-family: var(--display); font-size: 24px; margin-right: 4px; }
  .bar .grow { flex: 1; }
  .bar select { width: auto; padding: 6px 10px; font-size: 12.5px; }
  .bar .btn, .bar button { font-size: 12.5px; padding: 7px 12px; }
  .line { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; min-width: 0; }
  .line .pill { overflow: hidden; text-overflow: ellipsis; }
  .line .dot.warn { background: var(--warn); }
  .more { position: absolute; top: 46px; right: 16px; z-index: 50; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; min-width: 200px; box-shadow: 0 20px 40px -12px rgba(0,0,0,.7); }
  .more a { display: block; padding: 9px 12px; border-radius: 8px; color: var(--ink); font-size: 13px; }
  .more a:hover { background: var(--chip); }
  .bell { position: relative; }
  .bell .n { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; border-radius: 99px; background: var(--bad); color: #fff; font: 600 10px/17px var(--font); text-align: center; padding: 0 4px; }
  .notes { position: absolute; top: 46px; right: 16px; width: 360px; max-height: 420px; overflow: auto; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; z-index: 50; box-shadow: 0 20px 40px -12px rgba(0, 0, 0, .7); }
  .notes .q { padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .notes .q:hover { background: var(--chip); }
  .notes .q.new { border-left: 3px solid var(--gold); }
  .notes .q small { display: block; color: var(--faint); margin-top: 3px; }

  .cols { flex: 1; display: grid; grid-template-columns: 340px minmax(0, 1fr) 340px; min-height: 0; }
  .col { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
  .col:last-child { border-right: 0; }

  /* the chats list */
  .lhead { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
  .search { position: relative; }
  .search input { padding: 9px 12px 9px 34px; border-radius: 10px; background: rgba(255,255,255,.04); }
  .search::before { content: "⌕"; position: absolute; left: 12px; top: 50%; transform: translateY(-52%); color: var(--faint); font-size: 16px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { font-size: 12.5px; padding: 5px 11px; border-radius: 99px; background: rgba(255,255,255,.04); border-color: transparent; color: var(--muted); white-space: nowrap; flex: 0 0 auto; }
  .tabs button.on { background: var(--gold-soft); color: var(--gold-2); border-color: rgba(232,199,122,.4); }
  .tabs button i { font-style: normal; margin-left: 6px; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 99px; background: var(--raise); color: var(--ink); }
  .tabs button.hot i { background: var(--bad); color: #fff; }
  .lfoot { display: flex; gap: 8px; align-items: center; }
  .lfoot select { padding: 6px 10px; font-size: 12.5px; }
  .lfoot .cnt { font-size: 12px; color: var(--faint); white-space: nowrap; }
  .rows { overflow: auto; flex: 1; }
  .conv { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; padding: 11px 14px; cursor: pointer; transition: .12s; position: relative; }
  .conv::after { content: ""; position: absolute; left: 72px; right: 0; bottom: 0; border-bottom: 1px solid var(--line); }
  .conv:hover { background: rgba(255, 255, 255, .03); }
  .conv.on { background: rgba(255,255,255,.06); }
  .conv.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }
  .av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 15px; color: #0b0d12; flex: 0 0 auto; }
  .conv .top { display: flex; align-items: baseline; gap: 8px; }
  .conv .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .conv .tm { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  .conv .tm.wait { color: var(--warn); font-weight: 600; }
  .conv .pv { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .conv .pv i { font-style: normal; color: var(--teal); }
  .conv .pv .tick { color: var(--faint); margin-right: 3px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .att, .tg { font: 600 10.5px var(--font); padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--chip); color: var(--muted); }
  .att { background: var(--warn-soft); color: var(--warn); }
  .att.late, .tg.hot, .tg.bad { background: var(--bad-soft); color: var(--bad); }
  .tg.nur { background: rgba(92, 207, 181, .12); color: var(--teal); }
  .att.pool { background: rgba(181, 145, 243, .14); color: var(--violet); }
  .tg.view { background: rgba(126, 166, 248, .12); color: var(--blue); }
  .tg.person { background: rgba(126, 166, 248, .12); color: var(--blue); }
  .empty { padding: 30px 20px; text-align: center; color: var(--muted); font-size: 13px; }
  .welcome { margin: auto; max-width: 380px; text-align: center; color: var(--muted); padding: 24px; }
  .welcome .wic { font-size: 40px; margin-bottom: 10px; }
  .welcome h2 { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 18px; font-weight: 600; margin-bottom: 6px; }

  /* the conversation, WhatsApp-like */
  .chead { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.02); flex-wrap: wrap; }
  .chead .av { width: 40px; height: 40px; font-size: 14px; }
  .chead .who { flex: 1 1 180px; min-width: 0; }
  .chead .nm { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chead .ph { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chead select { width: auto; padding: 6px 10px; font-size: 12px; }
  .chead select.own { max-width: 150px; }
  .chead .back, .chead .pbtn { display: none; padding: 6px 10px; }
  .switch { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; border-radius: 99px; border: 1px solid var(--line-2); cursor: pointer; font-size: 12px; user-select: none; white-space: nowrap; }
  .switch .knob { width: 30px; height: 18px; border-radius: 99px; background: var(--faint); position: relative; transition: .2s; }
  .switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch.on .knob { background: #25d366; } .switch.on .knob::after { left: 14px; }
  .banner { margin: 8px 16px 0; padding: 8px 12px; border-radius: 10px; font-size: 12.5px; display: flex; gap: 10px; align-items: center; }
  .banner.view { background: rgba(126, 166, 248, .1); border: 1px solid rgba(126, 166, 248, .22); color: #c9d7ff; }
  .banner.warn { background: var(--warn-soft); border: 1px solid rgba(240, 179, 94, .25); color: var(--warn); }
  .banner.bad { background: var(--bad-soft); border: 1px solid rgba(242, 125, 125, .25); color: var(--bad); }
  .banner.att { background: var(--warn-soft); border: 1px solid rgba(240, 179, 94, .3); color: var(--warn); flex-wrap: wrap; white-space: normal; border-radius: 10px; font: 400 12.5px var(--font); padding: 8px 12px; }
  .banner.att .why { flex: 1 1 200px; overflow-wrap: anywhere; }
  .banner.att.late { background: var(--bad-soft); border-color: rgba(242, 125, 125, .3); color: var(--bad); }
  .banner.att button { font-size: 11.5px; padding: 4px 10px; }
  .thread { flex: 1; overflow: auto; padding: 14px 7% 18px; display: flex; flex-direction: column; gap: 4px;
            background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0) 0 0 / 22px 22px, #0c1018; }
  .day { align-self: center; font-size: 11.5px; color: var(--muted); padding: 4px 12px; border-radius: 8px; background: #1a2030; margin: 10px 0 6px; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .b { max-width: min(72%, 560px); padding: 6px 9px 5px 10px; border-radius: 10px; font-size: 13.8px; line-height: 1.42; white-space: pre-wrap; position: relative; box-shadow: 0 1px 1.5px rgba(0,0,0,.35); margin-top: 2px; }
  .b.received { align-self: flex-start; background: #1f2633; border-top-left-radius: 2px; }
  .b.sent { align-self: flex-end; background: #0b4a3e; border-top-right-radius: 2px; }
  .b.sent.person { background: #1d3557; }
  .b.suggested { align-self: flex-end; background: transparent; border: 1px dashed rgba(37, 211, 102, .45); box-shadow: none; }
  .b.failed { outline: 1px solid rgba(242, 125, 125, .7); }
  .b .by { display: block; font-size: 11.5px; font-weight: 600; color: #53bdeb; margin-bottom: 1px; }
  .b.sent .by { color: #7fe0b5; } .b.sent.person .by { color: #9cc2ff; }
  .b .m { font-size: 10.5px; color: rgba(255,255,255,.55); margin-top: 3px; display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; white-space: normal; }
  .b .m .chip { margin: 0; font-size: 10px; padding: 0 6px; }
  .b .err { color: var(--bad); font-size: 11px; margin-top: 4px; }
  .compose { border-top: 1px solid var(--line); padding: 8px 12px 10px; background: rgba(255,255,255,.02); }
  .compose .rowc { display: flex; gap: 8px; align-items: flex-end; position: relative; }
  .compose .ib { padding: 8px 10px; border-radius: 10px; font-size: 15px; line-height: 1; flex: 0 0 auto; background: transparent; border-color: transparent; color: var(--muted); }
  .compose .ib:hover { color: var(--ink); background: var(--raise); }
  .compose textarea { min-height: 42px; max-height: 140px; resize: none; border-radius: 12px; background: rgba(255,255,255,.05); flex: 1; }
  .compose .sendb { width: 42px; height: 42px; border-radius: 50%; padding: 0; display: grid; place-items: center; font-size: 17px; flex: 0 0 auto; background: #25d366; border-color: #25d366; color: #06281a; }
  .compose .sendb:disabled { background: var(--raise); border-color: var(--line-2); color: var(--faint); }
  .drop { position: absolute; bottom: 50px; left: 0; width: 360px; max-width: calc(100vw - 40px); max-height: 300px; overflow: auto; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; z-index: 30; box-shadow: 0 20px 40px -12px rgba(0, 0, 0, .7); }
  .drop .q { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
  .drop .q:hover { background: var(--chip); }
  .drop .q b { display: block; font-size: 12px; color: var(--gold-2); }

  /* the lead profile */
  .prof { overflow: auto; padding: 0 0 18px; background: rgba(255,255,255,.012); position: relative; }
  .prof .big { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 22px 18px 16px; border-bottom: 1px solid var(--line); }
  .prof .big .av { width: 72px; height: 72px; font-size: 24px; }
  .prof h3 { font-family: var(--font); font-weight: 600; font-size: 17px; margin: 4px 0 0; }
  .prof .big .tags { justify-content: center; }
  .prof > .kv, .prof > .sec, .prof > .pipe, .prof > .ichips { margin-left: 18px; margin-right: 18px; }
  .prof .pclose { display: none; position: absolute; right: 12px; top: 12px; }
  .sec { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .sec h2 { margin-bottom: 8px; }
  .pipe { display: flex; gap: 3px; margin-top: 14px; }
  .pipe i { flex: 1; height: 5px; border-radius: 3px; background: var(--chip); }
  .pipe i.done { background: var(--gold); }
  .pipe + .small { margin: 6px 18px 0; }
  .fact { font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .fact:last-of-type { border-bottom: 0; }
  .fact s { color: var(--faint); }
  .kv { display: grid; grid-template-columns: 84px 1fr; gap: 7px 10px; font-size: 12.8px; margin-top: 14px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .ichips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
  .ic { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .ic.intent { color: var(--blue); border-color: rgba(126, 166, 248, .3); background: rgba(126, 166, 248, .08); }
  .ic.area { color: var(--teal); border-color: rgba(92, 207, 181, .3); background: rgba(92, 207, 181, .07); }
  .ic.dk { color: var(--gold-2, #e8c77a); border-color: rgba(232, 199, 122, .45); background: rgba(232, 199, 122, .1); font-weight: 600; }
  .ic.budget { color: var(--gold-2); border-color: rgba(232, 199, 122, .3); background: var(--gold-soft); }
  .ic.size { color: var(--violet); border-color: rgba(181, 145, 243, .3); background: rgba(181, 145, 243, .07); }
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: grid; place-items: center; z-index: 60; }
  .modal .panel { width: 520px; max-width: calc(100vw - 32px); max-height: 80vh; overflow: auto; }
  .tpl { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .tpl.on { border-color: rgba(232, 199, 122, .55); background: var(--gold-soft); }
  .preview { background: rgba(37, 211, 102, .1); border: 1px solid rgba(37, 211, 102, .25); border-radius: 12px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; margin: 10px 0; }
  .phone { position: fixed; left: 18px; bottom: 18px; width: 310px; z-index: 40; }
  .phone .panel { padding: 14px; }
  @media (max-width: 1280px) { .cols { grid-template-columns: 300px minmax(0, 1fr) 300px; } }
  @media (max-width: 1050px) {  /* the profile opens over the chat from its header */
    .cols { grid-template-columns: 300px minmax(0, 1fr); }
    .col.p { display: none; position: fixed; right: 0; top: 56px; bottom: 0; width: min(360px, 100vw); z-index: 45; background: var(--panel-solid); border-left: 1px solid var(--line-2); box-shadow: -20px 0 40px rgba(0,0,0,.5); }
    .cols.prof-open .col.p { display: flex; }
    .chead .pbtn, .prof .pclose { display: inline-block; }
  }
  @media (max-width: 760px) {
    .cols { grid-template-columns: 1fr; } .col.c { display: none; } .cols.open .col.l { display: none; } .cols.open .col.c { display: flex; }
    .chead .back { display: inline-block; } .thread { padding: 12px 10px; } .b { max-width: 86%; }
    .bar .hide-s { display: none; } .bar { flex-wrap: wrap; } .bar .ttl { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><span class="ttl">Inbox</span><span class="line" id="line"></span><span class="grow"></span>
    <select id="me" title="Viewing as" aria-label="Viewing as"></select>
    <button class="bell" id="bell" title="Notices" aria-label="Notices">🔔<span class="n" id="belln" hidden></span></button>
    <a class="btn" href="calendar.html">📅 Calendar</a><button id="phonebtn">📱 Sandbox phone</button>
    <button id="morebtn" aria-haspopup="true">More ▾</button>
    <div class="more" id="more" hidden><a href="qualify.html">Qualification and follow-ups</a><a href="test.html">🧪 Test Rania</a><a href="settings.html">Settings and connections</a></div></div>
  <div class="cols" id="cols">
    <section class="col l">
      <div class="lhead">
        <div class="search"><input id="q" type="search" placeholder="Search name, phone, area…" aria-label="Search conversations"></div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Show"></div>
        <div class="lfoot"><select id="stage" aria-label="Stage"></select><span class="cnt" id="cnt"></span></div>
      </div>
      <div class="rows" id="rows"></div>
    </section>
    <section class="col c" id="chat"><div class="welcome"><div class="wic">💬</div><h2>Your WhatsApp conversations</h2>Pick a conversation on the left.</div></section>
    <section class="col p prof" id="prof"></section>
  </div>
</div>
<div class="phone" id="phone" hidden><div class="panel glass">
  <div class="row" style="margin-bottom:8px"><h2 style="margin:0">Sandbox phone</h2><button id="phoneclose" style="flex:0">✕</button></div>
  <p class="small muted" id="phonehint" style="margin:0 0 8px">Message the office as a customer. It takes the same path as a real WhatsApp message.</p>
  <div class="row"><input id="pname" value="Ali Rahman"><input id="pnum" value="971501112233"></div>
  <div class="row" style="margin-top:8px"><input id="ptext" placeholder="Type as the customer…"><button class="primary" id="psend">Send</button></div>
</div></div>
<script type="module">
import { h, api, post, follow, header, toast, NAMES } from "./app.js";
header("inbox.html");
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let ME = params.get("as") || (() => { try { return localStorage.getItem("diwan.inbox.as"); } catch { return null; } })() || "omar";
let view = "all", stage = null, current = params.get("chat"), data = { rows: [], counts: {}, stages: [] }, detail = null, integ = null, team = [];
const PORTAL = { propertyfinder: "Property Finder", bayut: "Bayut", dubizzle: "Dubizzle", instagram: "Instagram" };
const ACTS = [["called", "📞 Called"], ["messaged", "💬 Messaged"], ["no_answer", "No answer"], ["not_needed", "Not needed…"]];
const left = (a) => a.pooled ? "in the Pool" : a.overdue ? `overdue ${-a.minutes_left}m` : `${a.minutes_left}m left`;

const COLORS = ["#e8c77a", "#5ccfb5", "#7ea6f8", "#b591f3", "#f0b35e", "#82d99f", "#f27d7d"];
const avatar = (name) => { const n = name || "?"; const c = COLORS[[...n].reduce((a, ch) => a + ch.charCodeAt(0), 0) % COLORS.length];
  return h("div", { class: "av", style: `background:${c}` }, n.replace(/^\+/, "").split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase()); };
const ago = (iso) => { if (!iso) return ""; const m = (Date.now() - new Date(iso)) / 6e4; return m < 1 ? "now" : m < 60 ? `${m | 0}m` : m < 1440 ? `${(m / 60) | 0}h` : `${(m / 1440) | 0}d`; };
const clock = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const day = (iso) => new Date(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const fill = (body, ps) => body.replace(/\{\{(\d+)\}\}/g, (_, i) => ps[i - 1] || `{{${i}}}`);

async function load() {
  const qs = new URLSearchParams({ view, person: ME, q: $("q").value.trim() });
  if (stage) qs.set("stage", stage);
  data = await api(`/api/chats?${qs}`);
  if (!current && data.rows.length) current = data.rows[0].phone;
  renderBar(); renderList();
  if (current) loadDetail();
}

const TABS = [["all", "All"], ["attention", "Needs you"], ["mine", "Mine"], ["new", "New"], ["waiting", "Waiting"], ["pool", "Pool"], ["nurture", "Nurture"]];
function renderBar() {
  const c = data.counts;
  $("tabs").replaceChildren(...TABS.map(([k, l]) => h("button", { role: "tab", "aria-selected": view === k, class: `${view === k ? "on" : ""} ${(k === "attention" || k === "pool") && c[k] ? "hot" : ""}`,
    onclick: () => { view = k; load(); } }, l, c[k] && k !== "all" ? h("i", {}, c[k]) : null)));
  $("stage").replaceChildren(h("option", { value: "" }, "All stages"),
    ...data.stages.map((st) => h("option", { value: st, selected: stage === st }, c.stages?.[st] ? `${st} · ${c.stages[st]}` : st)));
  $("cnt").textContent = `${data.rows.length} conversation${data.rows.length === 1 ? "" : "s"}`;
}

const when = (iso) => { if (!iso) return ""; const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return clock(iso);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return (now - d) < 6 * 864e5 ? d.toLocaleDateString("en-GB", { weekday: "short" }) : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); };
function renderList() {
  $("rows").replaceChildren(...(data.rows.length ? data.rows.map((r) => {
    const last = r.last;
    const who = !last ? "" : last.type === "received" ? "" : last.by === "rania" ? "Rania: " : `${NAMES[last.by] || last.by}: `;
    const waiting = r.waiting_min != null;
    return h("div", { class: `conv ${r.phone === current ? "on" : ""}`, onclick: () => { current = r.phone; $("cols").classList.add("open"); renderList(); loadDetail(); } },
      avatar(r.name),
      h("div", { style: "min-width:0" },
        h("div", { class: "top" }, h("div", { class: "nm" }, r.name),
          h("span", { class: `tm ${waiting ? "wait" : ""}`, title: waiting ? "The customer is waiting for a reply" : "" }, waiting ? `waiting ${r.waiting_min < 60 ? r.waiting_min + "m" : ((r.waiting_min / 60) | 0) + "h"}` : when(r.last_at))),
        h("div", { class: "pv", dir: "auto" }, last && last.type !== "received" ? h("span", { class: "tick" }, last.status === "failed" ? "⚠" : "✓") : null,
          who ? h("i", {}, who) : null, last ? last.text : ""),
        h("div", { class: "tags" },

    h("div", { class: "kv" }, h("span", {}, "Stage"), h("span", {}, d.stage), h("span", {}, "Deal"), h("span", {}, d.property || "—"),
      h("span", {}, "Broker"), h("span", {}, NAMES[d.broker] || d.broker || "—"), h("span", {}, "Replying"), h("span", {}, d.mode === "ai" ? "Rania (AI)" : NAMES[d.handled_by] || "A person")),
    h("div", { class: "pipe", title: d.stage }, d.stages.slice(0, 8).map((s, i) => h("i", { class: i <= idx ? "done" : "", title: s }))),
    h("div", { class: "small muted" }, `${d.stage}${idx >= 0 && idx < 8 ? ` · step ${idx + 1} of 8` : ""}`),
    d.chips.length ? h("div", { class: "ichips", style: "margin-top:12px" }, d.chips.map((c) => h("span", { class: `ic ${c.kind}` }, c.label))) : null,
    d.qualify ? qualifyPanel(d.qualify) : null,
    visitPanel(d.visit),
    quietPanel(d.quiet),
    deckPanel(d),
    followPanel(d),
    h("div", { class: "sec" }, h("h2", {}, "What the office learned"),
      d.facts.length ? h("div", {}, d.facts.map((f) => h("div", { class: "fact" }, h("span", { class: "chip" }, f.id), " ", f.text))) : h("p", { class: "small muted" }, "Nothing yet. Facts appear as the customer states them."),
      ...d.replaced.map((f) => h("div", { class: "fact" }, h("span", { class: "chip bad" }, f.id), " ", h("s", {}, `"${f.quote}"`), h("span", { class: "small muted" }, ` replaced by ${f.by}`)))),
    d.cards.length || d.tasks.length ? h("div", { class: "sec" }, h("h2", {}, "Open work"),
      ...d.cards.map((c) => h("div", { class: "fact" }, h("span", { class: "chip warn" }, c.who), " ", c.text)),
      ...d.tasks.map((t) => h("div", { class: "fact" }, h("span", { class: "chip" }, t.who), " ", t.text))) : null,
    h("div", { class: "sec row" }, h("a", { class: "btn", href: "graph.html" }, "Memory graph"), h("a", { class: "btn", href: "office3d.html" }, "Ask Nova")));
}

$("phonebtn").onclick = () => $("phone").hidden = !$("phone").hidden;
$("morebtn").onclick = (e) => { e.stopPropagation(); $("more").hidden = !$("more").hidden; };
addEventListener("click", (e) => { if (!e.target.closest("#more")) $("more").hidden = true; });
$("stage").onchange = (e) => { stage = e.target.value || null; load(); };
$("phoneclose").onclick = () => $("phone").hidden = true;
const psend = async () => {
  const t = $("ptext").value.trim(); if (!t) return;
  current = $("pnum").value.trim(); $("ptext").value = "";
  stage = null; view = "all"; $("q").value = "";  // show the conversation you just sent from, whatever was filtered
  try { await post("/api/chats/incoming", { phone: current, name: $("pname").value.trim() || null, text: t }); } catch (e) { toast(e.message); }
  load();
};
$("psend").onclick = psend;
$("ptext").onkeydown = (e) => { if (e.key === "Enter") psend(); };
let qt; $("q").oninput = () => { clearTimeout(qt); qt = setTimeout(load, 200); };

team = await api("/api/team");
$("me").replaceChildren(...[...team.map((t) => [t.id, `${t.name} · broker`]), ["layla", "Layla · owner"]].map(([id, l]) => h("option", { value: id, selected: id === ME }, `Viewing as ${l}`)));
$("me").onchange = (e) => { ME = e.target.value; try { localStorage.setItem("diwan.inbox.as", ME); } catch {} view = "attention"; load(); loadNotices(); };
loadNotices();
integ = await api("/api/integrations");
const p = integ.provider;
// the line as it really is: a provider that is chosen but not connected is said so, and nothing leaves the sandbox
const connected = (p === "aisensy" && integ.aisensy.connected) || (p === "cloud" && integ.cloud.connected);
const pname = { aisensy: "AiSensy", cloud: "Meta Cloud API" }[p];
$("line").replaceChildren(h("a", { class: "pill", href: "settings.html", title: connected ? "Real WhatsApp messages are sent and received" : "Replies stay in the sandbox until a line is connected (Settings)" },
  h("span", { class: `dot ${connected ? "on" : pname ? "warn" : ""}` }),
  connected ? `WhatsApp via ${pname}` : pname ? `${pname} chosen · not connected · sandbox only` : "Sandbox · no WhatsApp line yet"));
if (connected) $("phonehint").textContent = "WhatsApp is connected: real messages arrive too. This sandbox still works for testing.";
load();
follow((evs) => {
  if (evs.some((e) => /^(chat\.|fact\.|appointment\.|stage\.|task\.|lead\.|attention\.)/.test(e.type))) load();
  if (evs.some((e) => e.type.startsWith("notify."))) { loadNotices(); ping(evs); }
});
setInterval(() => { if (data.rows.some((r) => r.attention)) load(); }, 60000);  // countdowns move even when nothing happens
</script>
