<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwan Office</title>
<link rel="stylesheet" href="app.css">
<style>
  body { overflow: hidden; }
  main.nv-main { max-width: none; padding: 0; height: calc(100vh - 57px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 30%); }
  .talk { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .nv-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 28px; border-bottom: 1px solid var(--line); }
  .nv-head h1 { margin: 0; font-size: 26px; line-height: 1.2; }
  .nv-head .sub { margin: 2px 0 0; font-size: 13px; max-width: none; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; flex: 0 0 auto; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 7px 12px; font-size: 12.5px; box-shadow: none; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button.on { background: var(--gold-soft); color: var(--gold); }
  #answer { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  #answer > * { width: 100%; max-width: 760px; margin-inline: auto; }
  .answer { white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; color: var(--ink); }
  .answer .who { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; letter-spacing: .3px; }
  .answer.me { text-align: right; color: var(--muted); }
  .answer.refused, .answer.unknown, .answer.unsupported { color: var(--warn); }
  .answer button { margin: 8px 6px 0 0; font-size: 12.5px; padding: 5px 12px; }
  .answer .chip { margin: 6px 4px 0 0; }
  .start { margin: auto; text-align: center; color: var(--muted); max-width: 520px; }
  .start h2 { font-family: var(--display); font-size: 30px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink); margin: 0 0 6px; }
  .start p { margin: 0 0 18px; font-size: 14px; }
  .tries { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
  .tries button { font-size: 12.5px; padding: 5px 12px; }
  .compose { border-top: 1px solid var(--line); padding: 14px 28px; }
  .compose .in { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; align-items: center; }
  .compose input { flex: 1; min-width: 0; }
  #livebtn { flex: 0 0 auto; white-space: nowrap; }
  #livebtn.on { background: var(--ai); color: var(--teal); border-color: rgba(92, 207, 181, .4); }
  .side { border-left: 1px solid var(--line); background: rgba(255, 255, 255, .012); overflow-y: auto; min-height: 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
  .stats div { padding: 14px 8px; text-align: center; border-right: 1px solid var(--line); }
  .stats div:last-child { border-right: 0; }
  .stats b { display: block; font-size: 20px; font-weight: 600; color: var(--ink); }
  .stats span { font-size: 11px; color: var(--muted); }
  .sec { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .sec h2 { display: flex; justify-content: space-between; margin: 0 0 6px; font-size: 11px; }
  .it { padding: 6px 0; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
  .it a { color: var(--ink); }
  .it a:hover { color: var(--gold); }
  .it .late { color: var(--bad); font-size: 12px; }
  .said { font-size: 12.5px; color: var(--muted); }
  .none { font-size: 13px; color: var(--faint); }
  .more-btn { margin-top: 4px; font-size: 12px; padding: 3px 10px; }
  .pocket { width: 100%; min-height: 72px; }
  .notein { width: 100%; margin-bottom: 8px; }
  details.more { padding: 12px 20px; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .people { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .people button { font-size: 12px; padding: 4px 10px; }
  .people button.on { background: var(--gold-soft); color: var(--gold); }
  .line { padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--line); }
  @media (max-width: 1000px) { body { overflow: auto; } main.nv-main { display: block; height: auto; } .talk { height: 80vh; } .side { border-left: 0; } .nv-head { flex-wrap: wrap; } }
</style>
</head>
<body>
<main class="nv-main">
  <section class="talk">
    <div class="nv-head">
      <div><h1 id="hello">Nova</h1><p class="sub" id="wrap">Your PA.</p></div>
      <div class="seg" id="modes"></div>
    </div>
    <div id="answer"></div>
    <div class="compose"><div class="in">
      <button id="livebtn" title="Keep her on the line: talk without clicking">Go live</button>
      <input id="say" placeholder="Message Nova" aria-label="Message Nova">
      <button class="primary" id="go">Send</button>
    </div></div>
  </section>
  <aside class="side">
    <div class="stats" id="stats"></div>
    <div id="day"></div>
    <details class="more">
      <summary>Team briefings and live activity</summary>
      <div class="people" id="people"></div><div id="brief"></div>
      <div class="feed" id="feed" style="margin-top:12px"></div>
      <div class="row" style="margin-top:12px"><button id="correct">Demo: Karim corrects himself</button><button id="reset">Reset demo</button></div>
    </details>
  </aside>
</main>
<script type="module">
import { h, api, post, follow, header, describe, who, loadAgents, time, NAMES, toast, pa, SESSION } from "./app.js";
header("index.html");
const $ = (id) => document.getElementById(id);
await loadAgents();
let person = SESSION.person || "layla";
const TRIES = ["What needs me today?", "Block my 3pm today", "Remind me tomorrow at 10am to call Sara", "Who hasn't called Sara back?"];

// the conversation: the same one on every page, and it stays when you leave and come back
function bubble(m) {
  const box = h("div", { class: `answer ${m.from === "you" ? "me" : m.kind || ""}` }, m.from === "you" ? null : h("span", { class: "who" }, "Nova"), m.text);
  if (m.options?.length) box.append(h("div", {}, ...m.options.map((o) => h("button", { onclick: () => pa.say(o, m.kind === "confirm" ? o : `${(m.asked || "").replace(/\?$/, "")} (${o})${(m.asked || "").endsWith("?") ? "?" : ""}`) }, o))));
  if (m.cites?.length) box.append(h("div", {}, ...m.cites.slice(0, 6).map((c) => h("span", { class: "chip" }, c))));
  return box;
}
function empty() {
  return h("div", { class: "start" }, h("h2", {}, "Go live and just talk"), h("p", {}, "Nova stays on the line while you work, on every page. Or type below."),
    h("button", { class: "primary", onclick: () => pa.start() }, "Go live"),
    h("div", { class: "tries" }, ...TRIES.map((t) => h("button", { onclick: () => pa.say(t) }, t))));
}
function draw() { $("answer").replaceChildren(...(pa.log.length ? pa.log.map(bubble) : [empty()])); $("answer").scrollTop = 1e9; }
pa.subs.add(draw);
const paint = (s) => { const b = $("livebtn"); b.classList.toggle("on", s !== "off"); b.textContent = s === "off" ? "Go live" : "End call"; };
pa.states.add(paint);
$("livebtn").onclick = () => (pa.live ? pa.stop() : pa.start());
const send = () => { const t = $("say").value; $("say").value = ""; pa.say(t).then(() => day()); };
$("go").onclick = send;
$("say").onkeydown = (e) => { if (e.key === "Enter") send(); };

async function brief() {
  $("people").replaceChildren(...Object.entries(NAMES).map(([k, v]) => h("button", { class: k === person ? "on" : "", onclick: () => { person = k; brief(); day(); } }, v)));
  const b = await api(`/api/nova/brief/${person}`);
  const speak = h("button", { onclick: () => { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(b.text)); } }, "Read it aloud");
  $("brief").replaceChildren(h("div", { class: "line" }, h("strong", {}, b.text.split(". ")[0] + ".")),
    ...b.lines.map((l) => h("div", { class: "line" }, l.needs ? h("span", { class: "chip warn" }, "needs you") : h("span", { class: "chip" }, "changed"), " ", l.text,
      h("div", {}, ...l.refs.map((r) => h("span", { class: "chip" }, r))))),
    h("div", { class: "small muted", style: "margin-top:6px" }, `The agents are handling ${b.working.length} task(s).`), speak);
}

// The day, from the records: urgent first, then today, the pipeline, the money and what waits for this person.
const hhmm = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Dubai" });
const open = new Set();  // blocks the person opened: a redraw keeps them open
const list = (title, n, kids) => {  // five lines, then "show all"
  const all = open.has(title), shown = all ? kids : kids.slice(0, 5);
  return h("section", { class: "sec" }, h("h2", {}, title, n != null && n > 0 ? h("span", {}, String(n)) : null),
    ...(kids.length ? shown : [h("div", { class: "none" }, "Nothing here")]),
    kids.length > 5 ? h("button", { class: "more-btn", onclick: () => { all ? open.delete(title) : open.add(title); day(); } }, all ? "Show less" : `Show all ${kids.length}`) : null);
};
const decisionLink = (d) => d.deal ? `deal.html?deal=${encodeURIComponent(d.deal)}` : "#";
let dayN = 0;
async function day() {
  const n = ++dayN;
  const d = await api(`/api/pa/day?person=${person}`);
  if (n !== dayN) return;  // a newer one is on its way: an older answer never overwrites it
  $("hello").textContent = d.greeting;
  $("wrap").textContent = d.wrap || "Your PA. Ask anything, or tell her what to do.";
  $("stats").replaceChildren(...[[d.urgent.length, "Urgent"], [d.today.length, "Today"], [d.decisions.length, "Decisions"], [d.pipeline ? d.pipeline.new : d.reminders.length, d.pipeline ? "New leads" : "Reminders"]].map(([n, l]) => h("div", {}, h("b", {}, String(n)), h("span", {}, l))));
  $("modes").replaceChildren(...Object.entries({ normal: "At my desk", meeting: "Hey Pocket", dnd: "Do not disturb" }).map(([k, l]) =>
    h("button", { class: d.mode === k ? "on" : "", onclick: async () => { const r = await post("/api/pa/mode", { person, mode: k }); if (r.text) toast(r.text.slice(0, 120)); if (r.summary) pa.push({ from: "pa", text: r.text }); day(); } }, l)));
  const blocks = [];
  if (d.mode === "meeting") {
    const box = h("textarea", { class: "pocket", placeholder: "What's being said. Say \"Hey Pocket\" at the start of a line to ask something; everything else is only kept." });
    const keep = async () => { const t = box.value.trim(); if (!t) return; box.value = ""; const r = await post("/api/pa/say", { person, text: t, session: person }); if (r.text) toast(r.text.slice(0, 200)); await day(); document.querySelector("textarea.pocket")?.focus(); };
    box.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); keep(); } };
    const mic = window.SpeechRecognition || window.webkitSpeechRecognition;
    const listen = mic ? h("button", { onclick: () => { const r = new mic(); r.continuous = true; r.onresult = (e) => { box.value = e.results[e.results.length - 1][0].transcript; keep(); }; r.start(); toast("Listening in this browser"); } }, "🎙 Listen") : null;
    blocks.push(h("section", { class: "sec" }, h("h2", {}, "In a meeting", h("span", { class: "small muted" }, `${d.pocket?.lines.length || 0} lines kept`)), box,
      h("div", { class: "row", style: "margin-top:6px" }, h("button", { onclick: keep }, "Keep this"), listen),
      h("div", {}, ...(d.pocket?.lines || []).slice(-4).map((l) => h("div", { class: "said" }, l.text)))));
  }
  blocks.push(list("Urgent", d.urgent.length, d.urgent.map((u) => h("div", { class: "it" }, u.late ? h("span", { class: "late" }, "Late · ") : null,
      u.chat ? h("a", { href: `inbox.html?chat=${encodeURIComponent(u.chat)}` }, u.text) : u.deal ? h("a", { href: `deal.html?deal=${encodeURIComponent(u.deal)}` }, u.text) : u.text))),
    list("Today", d.today.length, d.today.map((v) => h("div", { class: "it" }, h("b", {}, hhmm(v.at)), ` ${v.what}${v.listing ? ` of ${v.listing}` : ""}${v.customer ? ` with ${v.customer} (${v.broker})` : ""}`,
      v.cares.length ? h("div", { class: "said" }, `Cares about: ${v.cares.join(", ")}`) : null, v.last ? h("div", { class: "said" }, `Last said: "${v.last}"`) : null))),
    list("Decisions waiting for you", d.decisions.length, d.decisions.map((x) => h("div", { class: "it" }, x.text, " ", x.deal ? h("a", { class: "btn", href: decisionLink(x) }, "Open") : null))));
  if (d.pipeline) blocks.push(list("Pipeline", null, [
    h("div", { class: "it" }, `${d.pipeline.new} new since yesterday · ${d.pipeline.hot} hot`),
    h("div", { class: "it" }, ...Object.entries(d.pipeline.by_stage).map(([s, n]) => h("span", { class: "chip", style: "margin:0 4px 4px 0" }, `${s} ${n}`))),
    ...d.pipeline.moved.map((m) => h("div", { class: "it" }, `${m.who} moved to ${m.stage}`)),
    d.pipeline.escalated.length ? h("div", { class: "it" }, `${d.pipeline.escalated.length} late call${d.pipeline.escalated.length === 1 ? "" : "s"} passed to another broker`) : null].filter(Boolean)));
  if (d.pipeline?.stuck.length) blocks.push(list("Stuck", d.pipeline.stuck.length, d.pipeline.stuck.map((s) => h("div", { class: "it" }, h("a", { href: `deal.html?deal=${encodeURIComponent(s.deal)}` }, s.property), ` · ${s.days} days quiet`))));
  if (d.money) blocks.push(list("Money", null, [h("div", { class: "it" }, `${d.money.received} payment${d.money.received === 1 ? "" : "s"} marked received · ${d.money.invoices} invoice step${d.money.invoices === 1 ? "" : "s"} done since yesterday`),
    ...d.money.commission_due.map((c) => h("div", { class: "it" }, c.text))]));
  if (d.errands.length) blocks.push(list("Errands", d.errands.length, d.errands.map((e) => h("div", { class: "it" }, h("b", {}, e.title), h("div", { class: "said", style: "white-space:pre-wrap" }, e.draft),
      ...(e.sources || []).map((s) => h("div", { class: "said" }, h("a", { href: s, target: "_blank", rel: "noopener" }, s))),
      h("div", { class: "row", style: "margin-top:6px" }, h("button", { class: "primary", onclick: async () => { const r = await post(`/api/pa/errands/${e.id}/confirm`, { person }); toast(r.text); day(); } }, "Confirm"),
        h("button", { onclick: async () => { await post(`/api/pa/errands/${e.id}/cancel`, { person }); day(); } }, "Cancel"))))));
  if (d.idea) blocks.push(list("Lobby idea of the day", null, [h("div", { class: "it" }, d.idea.text, d.idea.why ? h("div", { class: "said" }, d.idea.why) : null, " ", h("a", { class: "btn", href: "lobby.html" }, "Open the Lobby"))]));
  if (d.lobby_waiting?.length) blocks.push(list("Experiments to decide", d.lobby_waiting.length, d.lobby_waiting.map((x) => h("div", { class: "it" }, h("b", {}, x.title), " ", x.line, " ", h("a", { class: "btn", href: "lobby.html" }, "Decide")))));
  if (document.activeElement?.id === "notein") return;  // never wipe what they're typing
  const notein = h("input", { id: "notein", class: "notein", placeholder: "Add to your notebook", onkeydown: async (e) => { if (e.key === "Enter" && e.target.value.trim()) { await post("/api/pa/notes", { person, text: e.target.value }); e.target.value = ""; e.target.blur(); day(); } } });
  blocks.push(list("Notebook", d.notes.length, [notein, ...d.notes.map((n) => h("div", { class: "it" }, n.text, " ", h("button", { onclick: async () => { await post(`/api/pa/notes/${n.id}/done`, { person }); day(); } }, "Done")))]));
  if (d.reminders.length) blocks.push(list("Reminders", d.reminders.length, d.reminders.map((r) => h("div", { class: "it" }, r.due ? h("b", {}, `${new Date(r.due).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "Asia/Dubai" })} ${hhmm(r.due)} `) : null, r.text, " ",
      h("button", { onclick: async () => { await post(`/api/pa/reminders/${r.id}/done`, { person }); day(); } }, "Done")))));
  $("day").replaceChildren(...blocks);
}

const feed = $("feed");
function add(evs) {
  for (const e of evs) {
    if (["agent.started"].includes(e.type)) continue;
    feed.prepend(h("div", { class: "ev" }, h("span", { class: "muted small" }, time(e.at), " "), h("span", { class: "who" }, who(e) || "office"), describe(e)));
  }
  while (feed.children.length > 200) feed.lastChild.remove();
}
$("correct").onclick = async () => {
  const m = await post("/api/meetings", { deal: "marina-1204", title: "Second meeting" });
  await post(`/api/meetings/${m.id}/consent?by=Karim%20Haddad`);
  await post(`/api/meetings/${m.id}/turn`, { speaker: "customer", text: "Actually, forget my brother. I'll pay it all myself." });
  brief();
};
$("reset").onclick = async () => { if (!confirm("Reset the office? Everything on screen starts again from the demo data. The old log is kept as a backup.")) return; await post("/api/demo/reset"); feed.replaceChildren(); toast("Demo office reset"); setTimeout(() => location.reload(), 400); };
const met = await post("/api/pa/arrive", { person });  // the first open of the day: the greeting and the top three
if (met.first && met.top.length) pa.push({ from: "pa", text: [met.greeting, ...met.top.map((x, i) => `${i + 1}. ${x.text}`)].join("\n") });
draw(); paint(pa.state);
brief(); day();
follow((evs) => { add(evs); brief(); if (!document.activeElement?.closest("#day")) day(); });  // never redraw under someone typing
</script>
</body>
</html>
