<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwan Office</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #080b11; }
  #stage { position: fixed; inset: 56px 420px 0 0; }
  #stage canvas { display: block; }
  .glass { background: rgba(12, 16, 24, .74); backdrop-filter: blur(14px) saturate(140%); border: 1px solid var(--line); }
  .toast { bottom: 96px; }
  .title { position: fixed; left: 12px; top: 64px; pointer-events: none; max-width: 620px; padding: 10px 14px 12px; border-radius: 14px;
           background: linear-gradient(180deg, rgba(11,15,24,.82), rgba(11,15,24,.55)); backdrop-filter: blur(6px); }
  .title .k { font: 600 11px var(--font); letter-spacing: 2.4px; color: var(--gold); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .title .k .live { width: 7px; height: 7px; border-radius: 50%; background: #ff6b6b; animation: live 1.6s infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, .6); } 70% { box-shadow: 0 0 0 8px rgba(255, 107, 107, 0); } 100% { box-shadow: none; } }
  .title h1 { font-size: 34px; margin: 6px 0 2px; }
  .title p { margin: 0; color: var(--muted); font-size: 13px; }
  .hud { position: fixed; left: 12px; top: 172px; display: flex; border-radius: 12px; overflow: hidden; }
  .stat { padding: 8px 16px; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat b { font: 600 18px var(--font); display: block; line-height: 1.2; }
  .stat span { font-size: 10px; color: var(--muted); letter-spacing: .9px; text-transform: uppercase; }
  .demo { position: fixed; right: 436px; top: 72px; display: flex; border-radius: 12px; overflow: hidden; }
  .demo button { border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; padding: 9px 14px; font-size: 12px; }
  .demo button:last-child { border-right: 0; }
  .demo button:hover { background: rgba(232, 199, 122, .1); }
  .demo .lbl { padding: 9px 12px; font: 600 10px var(--font); letter-spacing: 1.6px; color: var(--gold); text-transform: uppercase; border-right: 1px solid var(--line); display: flex; align-items: center; }
  .bar { position: fixed; left: calc((100vw - 420px) / 2); transform: translateX(-50%); bottom: 18px; display: flex; padding: 4px; border-radius: 14px; gap: 2px; max-width: calc(100vw - 460px); overflow-x: auto; scrollbar-width: none; }
  .bar button { background: transparent; border: 0; color: var(--muted); padding: 8px 12px; border-radius: 10px; font-size: 12.5px; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .bar button i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .bar button:hover { color: var(--ink); background: rgba(255, 255, 255, .05); }
  .bar button.on { color: #1b1608; background: var(--gold); }
  .bar .sep { width: 1px; background: var(--line-2); margin: 6px 4px; }
  .caption { position: fixed; left: calc((100vw - 420px) / 2); transform: translateX(-50%); bottom: 74px; max-width: 760px; padding: 9px 16px; border-radius: 12px;
             font-size: 13px; display: flex; gap: 10px; align-items: center; transition: opacity .4s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caption b { color: var(--gold-2); font-weight: 600; }
  .caption .t { color: var(--faint); font: 500 11px var(--mono); }
  .enter { position: fixed; left: calc((100vw - 420px) / 2); transform: translateX(-50%); top: 50%; pointer-events: none; font-family: var(--display); font-size: 54px;
           color: var(--gold-2); opacity: 0; transition: opacity .35s; text-shadow: 0 10px 40px rgba(0, 0, 0, .8); }
  .enter.on { opacity: 1; }
  .fade { position: fixed; inset: 56px 420px 0 0; background: #080b11; opacity: 0; pointer-events: none; transition: opacity .45s; }
  .fade.on { opacity: 1; }
  #side { position: fixed; top: 56px; right: 0; bottom: 0; width: 420px; display: flex; flex-direction: column; border-left: 1px solid var(--line);
          background: linear-gradient(180deg, rgba(15, 19, 28, .95), rgba(10, 13, 19, .97)); }
  #side .head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; }
  .orb { width: 46px; height: 46px; border-radius: 50%; flex: 0 0 46px; position: relative; background: conic-gradient(from 0deg, #f6e2ae, #c99a45, #5ccfb5, #7ea6f8, #f6e2ae); animation: spin 9s linear infinite; }
  .orb::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2a2f3d, #0d1018 70%); }
  .orb.zone { background: var(--zc, #e8c77a); animation: none; }
  .orb.speaking { animation: spin 3s linear infinite, ring 1.2s infinite; }
  .orb.listening { animation: spin 3s linear infinite, ringr 1.2s infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(232, 199, 122, .55); } 70% { box-shadow: 0 0 0 12px rgba(232, 199, 122, 0); } 100% { box-shadow: none; } }
  @keyframes ringr { 0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, .55); } 70% { box-shadow: 0 0 0 12px rgba(255, 107, 107, 0); } 100% { box-shadow: none; } }
  #side .who { flex: 1; min-width: 0; }
  #side .who .n { font-family: var(--display); font-size: 26px; line-height: 1; }
  #side .who .r { font-size: 12px; color: var(--muted); margin-top: 3px; }
  #side .body { flex: 1; overflow: auto; padding: 16px 20px; }
  #side .foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .ctl label { margin: 0 0 4px; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; }
  .ctl .full { grid-column: 1 / -1; display: flex; gap: 8px; }
  .ctl .full button { flex: 1; }
  .talk { width: 100%; padding: 14px; font-size: 14px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .wave { display: inline-flex; gap: 3px; align-items: center; height: 14px; }
  .wave i { width: 3px; background: currentColor; border-radius: 2px; height: 5px; }
  .on .wave i { animation: wv 1s ease-in-out infinite; }
  .wave i:nth-child(2) { animation-delay: .15s !important; } .wave i:nth-child(3) { animation-delay: .3s !important; } .wave i:nth-child(4) { animation-delay: .45s !important; }
  @keyframes wv { 50% { height: 14px; } }
  .hint { font-size: 12px; color: var(--muted); margin: 10px 0 4px; line-height: 1.5; }
  .msg { margin: 14px 0; line-height: 1.55; font-size: 13.5px; }
  .msg .from { font: 600 10px var(--font); letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 5px; }
  .msg.nova .card { border-left: 2px solid var(--gold); padding: 2px 0 2px 12px; }
  .msg.nova .from { color: var(--gold); }
  .msg.you { text-align: right; }
  .msg.you .card { display: inline-block; background: rgba(126, 166, 248, .14); border: 1px solid rgba(126, 166, 248, .22); padding: 9px 13px; border-radius: 14px 14px 4px 14px; text-align: left; }
  .opts button { font-size: 12px; padding: 6px 11px; margin: 8px 6px 0 0; border-radius: 99px; }
  .bigbtn { width: 100%; padding: 14px; font-size: 14px; border-radius: 12px; margin: 4px 0 14px; }
  .team { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: rgba(255, 255, 255, .02); }
  .team .tn { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .team .tn i { width: 8px; height: 8px; border-radius: 50%; }
  .team .st { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .team .ag { font-size: 12.5px; padding: 7px 0 0; border-top: 1px solid var(--line); margin-top: 8px; }
  .team .ag b { font-weight: 600; color: var(--gold-2); }
  .team .ag .w { color: #c9cfdb; display: block; margin-top: 2px; }
  .state { font: 600 10px var(--font); padding: 2px 7px; border-radius: 99px; letter-spacing: .4px; margin-left: auto; }
  .state.working { background: rgba(92, 207, 181, .14); color: var(--teal); } .state.waiting { background: var(--warn-soft); color: var(--warn); }
  .state.idle { background: var(--chip); color: var(--muted); }
  .boardcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: rgba(255, 255, 255, .02); }
  @media (max-width: 1100px) { .hud, .demo { display: none; } }
  @media (max-width: 900px) { #stage, .fade { inset: 56px 0 48% 0; } #side { top: 52%; width: 100%; } .bar, .caption, .title { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="fade" id="fade"></div>
<div class="enter" id="entering"></div>
<div class="title" id="title"></div>
<div class="hud glass" id="hud"></div>
<div class="demo glass" id="demo"></div>
<div class="caption glass" id="caption" style="opacity:0"></div>
<div class="bar glass" id="bar"></div>
<aside id="side">
  <div class="head"><div class="orb" id="orb"></div><div class="who"><div class="n" id="ztitle">Nova</div><div class="r" id="zsub">Chief of staff · the front desk</div></div>
    <button id="back" hidden>← HQ</button></div>
  <div class="body" id="zbody"></div>
  <div class="foot"><input id="say" placeholder="Ask your PA, or tell her who needs to do what…"><button id="mic" title="Speak">🎙</button><button class="primary" id="send">Send</button></div>
</aside>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script type="module">
import { h, api, post, follow, header, describe, loadAgents, NAMES, toast } from "./app.js";
import { attachFloor } from "./floor.js";
header("office3d.html");
const AG = await loadAgents();
const ROSTER = Object.values(AG);
const $ = (id) => document.getElementById(id);
const hex = (c) => "#" + c.toString(16).padStart(6, "0");
const kids = (id) => ROSTER.filter((a) => a.parent === id);

// ---------- departments: one room each on the HQ floor; enter one to see its whole team ----------
const DEPTS = {
  front:   { name: "Front desk", lead: "nova", color: 0xe8c77a, x: 0, z: 11, w: 15, d: 7.5, core: "Requests board", about: "Nova talks to the staff · Rania answers customers" },
  mkt:     { name: "Marketing", lead: "mkt", color: 0xf08fc0, x: -16, z: 11, w: 12, d: 7.5, core: "Brand brain", about: "The content studio: research → planning → scripting → editing → publishing" },
  meet:    { name: "Meeting room", lead: null, color: 0x7ea6f8, x: 16, z: 11, w: 12, d: 7.5, about: "Where the Scribe listens. Opens the meeting table." },
  sales:   { name: "Sales", lead: "sales", color: 0x7ea6f8, x: -16, z: 0, w: 12, d: 8, core: "Deal memory", about: "Meetings become quoted facts; decks use live facts only" },
  records: { name: "Records", lead: "records", color: 0xd9b26f, x: 0, z: 0, w: 12, d: 8, core: "Archive", about: "The archive and the numbers · every figure counted from records" },
  review:  { name: "Review", lead: "review", color: 0xb591f3, x: 16, z: 0, w: 12, d: 8, core: "Live facts", about: "Independent · sends back anything built on a replaced statement" },
  ops:     { name: "Operations", lead: "ops", color: 0x5ccfb5, x: -16, z: -11, w: 12, d: 8, core: "Portal", about: "Form F is filled from live facts and stops before Submit" },
  fin:     { name: "Finance", lead: "fin", color: 0x82d99f, x: 0, z: -11, w: 12, d: 8, core: "Ledger", about: "Every expected payment rests on the exact words it came from" },
  deal:    { name: "Deal room", lead: "deal", color: 0xe8a35c, x: 0, z: -22, w: 12, d: 8, core: "Gates", about: "From the yes to signed paperwork · the gates stand before anything binding" },
  comp:    { name: "Compliance", lead: "comp", color: 0xf27d7d, x: 16, z: -11, w: 12, d: 8, core: "Rule book", about: "Hears every payment change first · never decides suspicion" },
  lobby:   { name: "Lobby", lead: "lhost", color: 0x9fd0e8, x: 16, z: -22, w: 12, d: 8, core: "Playbooks", about: "A rep from each room reads what works · nothing changes until the owner approves" },
};
const DEPT_OF = {};
for (const [k, d] of Object.entries(DEPTS)) if (d.lead) DEPT_OF[d.lead] = k;
DEPT_OF.rania = "front";
function deptOf(agent) {
  for (let a = AG[agent]; a; a = AG[a.parent]) if (DEPT_OF[a.id]) return DEPT_OF[a.id];
  return "front";
}
const TEAM_LINE = { mprod: "Production turns the approved script into footage: the broker films it, or an AI presenter reads it.", research: "Research finds what is working.", plan: "Planning picks what to film and when.", mcopy: "Scripting writes it in our voice.",
  mart: "Editing cuts the takes into reels.", mpub: "Publishing checks the permit and posts it everywhere." };
const TEAM_NAME = { research: "Research", plan: "Planning", mcopy: "Scripting", mprod: "Production", mart: "Editing", mpub: "Publishing" };
const TICKET = { mprod: "Shoot", research: "Research", plan: "Plan", mcopy: "Script", mart: "Edit", mpub: "Post" };

// the teams on a department's own floor
function teamsOf(dept) {
  const d = DEPTS[dept];
  if (dept === "front") return [{ id: "rania", name: "Rania", agents: ["rania"], line: "Rania answers customers on WhatsApp." }];
  const ks = kids(d.lead);
  if (ks.some((k) => k.level === "room")) {
    const rooms = ks.filter((k) => k.id !== "mlib").map((r) => ({ id: r.id, name: TEAM_NAME[r.id] || r.role, agents: [r.id, ...kids(r.id).map((c) => c.id)], line: TEAM_LINE[r.id] || r.job }));
    return rooms;
  }
  return ks.map((k) => ({ id: k.id, name: k.name, agents: [k.id], line: k.job }));
}

// ---------- scene ----------
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputEncoding = THREE.sRGBEncoding;
stage.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);
scene.fog = new THREE.FogExp2(0x080b11, 0.011);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
const HQ_HOME = { pos: new THREE.Vector3(0, 46, 40), look: new THREE.Vector3(0, 0, -5) };  // every room in view
let FLOOR_HOME = { pos: new THREE.Vector3(27, 26, 27), look: new THREE.Vector3(-1, 0, -1) };
camera.position.set(0, 80, 95);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(HQ_HOME.look); controls.maxPolarAngle = 1.3; controls.minDistance = 8; controls.maxDistance = 100; controls.enableDamping = true; controls.dampingFactor = .08;
scene.add(new THREE.HemisphereLight(0xc9d6ff, 0x05070b, 0.32));
const key = new THREE.DirectionalLight(0xfff2dd, 0.7); key.position.set(18, 42, 22); key.castShadow = true;
Object.assign(key.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45 }); key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0004;
scene.add(key);
let composer = null;
if (THREE.EffectComposer && THREE.UnrealBloomPass) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(1024, 1024), .45, .4, .88));
}
const emissive = (color, i = 1.6) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: i, toneMapped: false });

function label(text, { size = 40, color = "#ece8df", bg = "rgba(10,13,19,.8)", accent = null, maxW = 820, pill = true, dark = false, border = null, prio = 1 } = {}) {
  const c = document.createElement("canvas"), x = c.getContext("2d");
  const font = `600 ${size}px Inter, system-ui, sans-serif`;
  x.font = font;
  const lines = []; let line = "";
  for (const w of String(text).split(" ")) { const t = line ? `${line} ${w}` : w; if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  lines.push(line);
  const padL = accent ? 54 : 30, W = Math.min(maxW, Math.max(...lines.map((l) => x.measureText(l).width))) + padL + 30, H = lines.length * size * 1.32 + 30;
  c.width = W; c.height = H; x.font = font;
  x.fillStyle = bg; x.beginPath(); x.roundRect(0, 0, W, H, pill && lines.length === 1 ? H / 2 : 22); x.fill();
  x.strokeStyle = border || (dark ? "rgba(0,0,0,.08)" : "rgba(255,255,255,.14)"); x.lineWidth = border ? 5 : 3; x.stroke();
  if (accent) { x.fillStyle = accent; x.beginPath(); x.arc(30, H / 2, 9, 0, Math.PI * 2); x.fill(); }
  x.fillStyle = color; x.textBaseline = "top";
  lines.forEach((l, i) => x.fillText(l, padL, 15 + i * size * 1.32));
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false, toneMapped: false }));
  s.scale.set(W / 125, H / 125, 1); s.renderOrder = 10 + prio; s.userData.prio = prio; s.userData.text = String(text).slice(0, 40);
  return s;
}

function floorPlane(group, size, inner) {
  const glow = document.createElement("canvas"); glow.width = glow.height = 512;
  const x = glow.getContext("2d"), g = x.createRadialGradient(256, 256, 20, 256, 256, 256);
  g.addColorStop(0, inner); g.addColorStop(.6, "#080a10"); g.addColorStop(1, "#040508"); x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  const f = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(glow), roughness: .85, metalness: .1 }));
  f.rotation.x = -Math.PI / 2; f.receiveShadow = true; group.add(f);
  const grid = new THREE.GridHelper(size * .8, size * .4, 0x161b27, 0x10141d); grid.material.transparent = true; grid.material.opacity = .35; grid.position.y = .01; group.add(grid);
}

function pad(group, x, z, w, d, color, name) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const base = new THREE.Mesh(new THREE.BoxGeometry(w, .16, d), new THREE.MeshStandardMaterial({ color: 0x0b0e15, roughness: .8 }));
  base.position.y = .08; base.receiveShadow = true; g.add(base);
  const top = new THREE.Mesh(new THREE.BoxGeometry(w - .5, .02, d - .5), new THREE.MeshStandardMaterial({ color: new THREE.Color(0x0c1018).lerp(new THREE.Color(color), .05), roughness: .9, emissive: color, emissiveIntensity: 0 }));
  top.position.y = .17; top.receiveShadow = true; g.add(top);
  const rimMat = emissive(color, .9);
  for (const [rw, rd, rx, rz] of [[w, .05, 0, d / 2], [w, .05, 0, -d / 2], [.05, d, w / 2, 0], [.05, d, -w / 2, 0]]) {
    const r = new THREE.Mesh(new THREE.BoxGeometry(rw, .05, rd), rimMat); r.position.set(rx, .17, rz); g.add(r);
  }
  if (name) { const s = label(name, { size: 40, accent: hex(color) }); s.position.set(-w / 2 + 2, .9, d / 2 - .2); g.add(s); }
  group.add(g);
  return { g, top, rimMat, flash: 0 };
}

// a desk with a screen that shows the agent's work, and the robot at it
function makeRobot(color, lead, chief) {
  const bot = new THREE.Group();
  const shell = new THREE.MeshStandardMaterial({ color: 0xe9ebf1, roughness: .32, metalness: .15 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.36, .46, .95, 28), shell); body.position.y = .72; body.castShadow = true; bot.add(body);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(.3, .36, .08, 28), new THREE.MeshStandardMaterial({ color: 0x2a3142 })); collar.position.y = 1.22; bot.add(collar);
  const headG = new THREE.Group(); headG.position.y = 1.45; bot.add(headG);  // turns at the neck
  const head = new THREE.Mesh(new THREE.SphereGeometry(.42, 32, 20), shell); head.scale.set(1.05, .86, .95); head.position.y = .17; head.castShadow = true; headG.add(head);
  const face = new THREE.Mesh(new THREE.BoxGeometry(.6, .26, .1), new THREE.MeshStandardMaterial({ color: 0x07090e, roughness: .2, metalness: .6 })); face.position.set(0, .18, .34); headG.add(face);
  const eyeMat = emissive(color, 2.2), eyes = [];
  for (const ex of [-.13, .13]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.05, 16, 12), eyeMat); e.position.set(ex, .19, .4); headG.add(e); eyes.push(e); }
  if (lead) { const halo = new THREE.Mesh(new THREE.TorusGeometry(chief ? .38 : .28, .022, 8, 40), emissive(0xe8c77a, chief ? 2.2 : 1.2)); halo.rotation.x = Math.PI / 2; halo.position.y = 2.2; bot.add(halo); }
  return { bot, eyeMat, body, head, headG, eyes };
}

const SCREEN_W = 320, SCREEN_H = 200, SCREEN_SCALE = 1.6;
function station(group, id, x, z, color, { scale = 1, screen = true, rotY = 0 } = {}) {
  const a = AG[id];
  const g = new THREE.Group(); g.position.set(x, .18, z); g.rotation.y = rotY; g.scale.setScalar(scale);
  const desk = new THREE.Mesh(new THREE.BoxGeometry(2.1, .07, 1.0), new THREE.MeshStandardMaterial({ color: 0x1e2534, roughness: .35, metalness: .4 }));
  desk.position.set(0, .82, 1.15); desk.castShadow = true; g.add(desk);
