<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwan Office</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #080b11; }
  #stage { position: fixed; inset: 56px 420px 0 0; }
  #stage canvas { display: block; }

  /* overlays on the floor */
  .glass { background: rgba(12, 16, 24, .72); backdrop-filter: blur(14px) saturate(140%); border: 1px solid var(--line); }
  .title { position: fixed; left: 22px; top: 74px; pointer-events: none; }
  .title .k { font: 600 11px var(--font); letter-spacing: 2.4px; color: var(--gold); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .title .k .live { width: 7px; height: 7px; border-radius: 50%; background: #ff6b6b; box-shadow: 0 0 0 0 rgba(255, 107, 107, .6); animation: live 1.6s infinite; }
  @keyframes live { 70% { box-shadow: 0 0 0 8px rgba(255, 107, 107, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); } }
  .title h1 { font-size: 34px; margin: 6px 0 2px; }
  .title p { margin: 0; color: var(--muted); font-size: 13px; }
  .hud { position: fixed; left: 22px; top: 162px; display: flex; border-radius: 12px; overflow: hidden; }
  .stat { padding: 8px 16px; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat b { font: 600 18px var(--font); display: block; color: var(--ink); line-height: 1.2; }
  .stat span { font-size: 10px; color: var(--muted); letter-spacing: .9px; text-transform: uppercase; }
  .demo { position: fixed; right: 436px; top: 72px; display: flex; gap: 0; border-radius: 12px; overflow: hidden; }
  .demo button { border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; padding: 9px 14px; font-size: 12px; color: var(--ink); }
  .demo button:last-child { border-right: 0; }
  .demo button:hover { background: rgba(232, 199, 122, .1); }
  .demo .lbl { padding: 9px 12px; font: 600 10px var(--font); letter-spacing: 1.6px; color: var(--gold); text-transform: uppercase; border-right: 1px solid var(--line); display: flex; align-items: center; }
  .zones { position: fixed; left: 50%; transform: translateX(calc(-50% - 210px)); bottom: 18px; display: flex; padding: 4px; border-radius: 14px; gap: 2px; }
  .zones button { background: transparent; border: 0; color: var(--muted); padding: 8px 13px; border-radius: 10px; font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
  .zones button i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .zones button:hover { color: var(--ink); background: rgba(255, 255, 255, .05); }
  .zones button.on { color: #1b1608; background: var(--gold); }
  .ticker { position: fixed; left: 50%; transform: translateX(calc(-50% - 210px)); bottom: 74px; max-width: 760px; padding: 9px 16px; border-radius: 12px;
            font-size: 13px; display: flex; gap: 10px; align-items: center; transition: opacity .4s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticker b { color: var(--gold-2); font-weight: 600; }
  .ticker .t { color: var(--faint); font: 500 11px var(--mono); }

  /* the side panel */
  #side { position: fixed; top: 56px; right: 0; bottom: 0; width: 420px; display: flex; flex-direction: column; border-left: 1px solid var(--line);
          background: linear-gradient(180deg, rgba(15, 19, 28, .94), rgba(10, 13, 19, .96)); }
  #side .head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; }
  .orb { width: 46px; height: 46px; border-radius: 50%; flex: 0 0 46px; position: relative;
         background: conic-gradient(from 0deg, #f6e2ae, #c99a45, #5ccfb5, #7ea6f8, #f6e2ae); animation: spin 9s linear infinite; }
  .orb::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2a2f3d, #0d1018 70%); }
  .orb.zone { background: var(--zc, #e8c77a); animation: none; }
  .orb.speaking { box-shadow: 0 0 0 0 rgba(232, 199, 122, .55); animation: spin 3s linear infinite, ring 1.2s infinite; }
  .orb.listening { box-shadow: 0 0 0 0 rgba(255, 107, 107, .55); animation: spin 3s linear infinite, ringr 1.2s infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ring { 70% { box-shadow: 0 0 0 12px rgba(232, 199, 122, 0); } 100% { box-shadow: 0 0 0 0 rgba(232, 199, 122, 0); } }
  @keyframes ringr { 70% { box-shadow: 0 0 0 12px rgba(255, 107, 107, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); } }
  #side .who { flex: 1; min-width: 0; }
  #side .who .n { font-family: var(--display); font-size: 26px; line-height: 1; }
  #side .who .r { font-size: 12px; color: var(--muted); margin-top: 3px; }
  #side .body { flex: 1; overflow: auto; padding: 16px 20px; }
  #side .foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  #side .foot input { border-radius: 12px; }
  .ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .ctl label { margin: 0 0 4px; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; }
  .ctl .full { grid-column: 1 / -1; display: flex; gap: 8px; }
  .ctl .full button { flex: 1; }
  .talk { width: 100%; padding: 14px; font-size: 14px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .wave { display: inline-flex; gap: 3px; align-items: center; height: 14px; }
  .wave i { width: 3px; background: currentColor; border-radius: 2px; height: 5px; }
  .on .wave i { animation: wv 1s ease-in-out infinite; }
  .wave i:nth-child(2) { animation-delay: .15s !important; } .wave i:nth-child(3) { animation-delay: .3s !important; } .wave i:nth-child(4) { animation-delay: .45s !important; }
  @keyframes wv { 50% { height: 14px; } }
  .hint { font-size: 12px; color: var(--muted); margin: 10px 0 4px; line-height: 1.5; }
  .msg { margin: 14px 0; line-height: 1.55; font-size: 13.5px; }
  .msg .from { font: 600 10px var(--font); letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 5px; }
  .msg.nova .card { border-left: 2px solid var(--gold); padding: 2px 0 2px 12px; }
  .msg.nova .from { color: var(--gold); }
  .msg.you { text-align: right; }
  .msg.you .card { display: inline-block; background: rgba(126, 166, 248, .14); border: 1px solid rgba(126, 166, 248, .22); padding: 9px 13px; border-radius: 14px 14px 4px 14px; text-align: left; }
  .opts button { font-size: 12px; padding: 6px 11px; margin: 8px 6px 0 0; border-radius: 99px; }
  .agentcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: rgba(255, 255, 255, .02); }
  .agentcard .nm { font-weight: 600; } .agentcard .rl { color: var(--muted); font-size: 12px; }
  .agentcard .jb { font-size: 12.5px; color: #c9cfdb; margin-top: 6px; }
  .agentcard .nv { font-size: 12px; color: var(--bad); margin-top: 6px; }
  .ev3 { font-size: 12.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .ev3 b { color: var(--gold-2); font-weight: 600; margin-right: 5px; }
  .boardcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: rgba(255, 255, 255, .02); }
  @media (max-width: 1100px) { .hud, .demo { display: none; } }
  @media (max-width: 900px) { #stage { inset: 56px 0 48% 0; } #side { top: 52%; width: 100%; } .zones, .ticker, .title { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="title"><div class="k"><span class="live"></span>Live · Diwan Realty HQ</div><h1>The <em>office</em></h1><p>Every robot is a chartered agent. Every move is an event in the log.</p></div>
<div class="hud" id="hud"></div>
<div class="demo glass" id="demo"></div>
<div class="ticker glass" id="ticker" style="opacity:0"></div>
<div class="zones glass" id="zones"></div>
<aside id="side">
  <div class="head"><div class="orb" id="orb"></div><div class="who"><div class="n" id="ztitle">Nova</div><div class="r" id="zsub">Chief of staff · the front desk</div></div>
    <button id="back" hidden>Floor</button></div>
  <div class="body" id="zbody"></div>
  <div class="foot"><input id="say" placeholder="Ask Nova, or tell her who needs to do what…"><button id="mic" title="Speak">🎙</button><button class="primary" id="send">Send</button></div>
</aside>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script type="module">
import { h, api, post, follow, header, describe, loadAgents, NAMES, toast } from "./app.js";
header("office3d.html");
const AG = await loadAgents();
const $ = (id) => document.getElementById(id);
const hex = (c) => "#" + c.toString(16).padStart(6, "0");

// ---------- the floor plan: each team has a room; each agent its own desk ----------
const ZONES = {
  front:   { name: "Front desk", x: 0,   z: 11,  w: 15, d: 7.5, color: 0xe8c77a, agents: ["nova", "rania"], about: "Nova talks to the staff · Rania answers customers on WhatsApp" },
  sales:   { name: "Sales",      x: -16, z: 3,   w: 12, d: 9,  color: 0x7ea6f8, agents: ["sales", "scribe", "deck"], about: "Meetings become quoted facts; decks use live facts only" },
  ops:     { name: "Operations", x: -16, z: -9,  w: 12, d: 8,  color: 0x5ccfb5, agents: ["ops", "formf"], about: "Form F is filled from live facts and stops before Submit" },
  fin:     { name: "Finance",    x: 0,   z: -11, w: 12, d: 7,  color: 0x82d99f, agents: ["fin", "pay"], about: "Every expected payment rests on the exact words it came from" },
  comp:    { name: "Compliance", x: 16,  z: -9,  w: 12, d: 8,  color: 0xf27d7d, agents: ["comp", "screen", "sof", "report"], about: "Hears every payment change first · never decides suspicion" },
  review:  { name: "Review",     x: 16,  z: 3,   w: 12, d: 9,  color: 0xb591f3, agents: ["review", "factcheck", "devil"], about: "Independent · sends back anything built on a replaced statement" },
  records: { name: "Records",    x: 0,   z: 0,   w: 12, d: 8,  color: 0xd9b26f, agents: ["records", "archivist", "analyst"], about: "The archive and the numbers · every figure counted from records" },
};
const ZONE_OF = {};
for (const [k, z] of Object.entries(ZONES)) for (const a of z.agents) ZONE_OF[a] = k;

// ---------- scene ----------
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputEncoding = THREE.sRGBEncoding;
stage.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b11);
scene.fog = new THREE.FogExp2(0x080b11, 0.0125);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
const HOME = { pos: new THREE.Vector3(1.5, 29, 31), look: new THREE.Vector3(0, 0, -0.5) };
camera.position.set(0, 80, 95);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.look); controls.maxPolarAngle = 1.3; controls.minDistance = 10; controls.maxDistance = 95; controls.enableDamping = true; controls.dampingFactor = 0.08;

scene.add(new THREE.HemisphereLight(0xc9d6ff, 0x05070b, 0.32));
const key = new THREE.DirectionalLight(0xfff2dd, 0.7); key.position.set(18, 42, 22); key.castShadow = true;
Object.assign(key.shadow.camera, { left: -42, right: 42, top: 42, bottom: -42 }); key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7ea6f8, 0.25); rim.position.set(-30, 18, -30); scene.add(rim);

// floor: dark stone with a warm pool of light under the office
const glow = document.createElement("canvas"); glow.width = glow.height = 512;
{ const x = glow.getContext("2d"), g = x.createRadialGradient(256, 256, 20, 256, 256, 256);
  g.addColorStop(0, "#0e121b"); g.addColorStop(.6, "#080a10"); g.addColorStop(1, "#040508"); x.fillStyle = g; x.fillRect(0, 0, 512, 512); }
const floor = new THREE.Mesh(new THREE.PlaneGeometry(160, 130), new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(glow), roughness: 0.85, metalness: 0.1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(120, 60, 0x161b27, 0x10141d); grid.material.transparent = true; grid.material.opacity = 0.35; grid.position.y = 0.01; scene.add(grid);

// bloom gives screens, rims and orbs their glow
let composer = null;
if (THREE.EffectComposer && THREE.UnrealBloomPass && new URLSearchParams(location.search).get("fx") !== "0") {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  const q = new URLSearchParams(location.search);
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(1024, 1024), +(q.get("bloom") ?? .45), .4, +(q.get("th") ?? .88)));
  if (THREE.GammaCorrectionShader && q.get("gamma") === "1") composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
}

function label(text, { size = 40, color = "#ece8df", bg = "rgba(10,13,19,.78)", accent = null, maxW = 820, pill = true, dark = false } = {}) {
  const c = document.createElement("canvas"), x = c.getContext("2d");
  const font = `600 ${size}px Inter, system-ui, sans-serif`;
  x.font = font;
  const words = String(text).split(" "), lines = [];
  let line = "";
  for (const w of words) { const t = line ? `${line} ${w}` : w; if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  lines.push(line);
  const padL = accent ? 54 : 30, W = Math.min(maxW, Math.max(...lines.map((l) => x.measureText(l).width))) + padL + 30, H = lines.length * size * 1.32 + 30;
  c.width = W; c.height = H; x.font = font;
  x.fillStyle = bg; x.beginPath(); x.roundRect(0, 0, W, H, pill && lines.length === 1 ? H / 2 : 22); x.fill();
  x.strokeStyle = dark ? "rgba(0,0,0,.08)" : "rgba(255,255,255,.12)"; x.lineWidth = 3; x.stroke();
  if (accent) { x.fillStyle = accent; x.beginPath(); x.arc(30, H / 2, 9, 0, Math.PI * 2); x.fill(); }
  x.fillStyle = color; x.textBaseline = "top";
  lines.forEach((l, i) => x.fillText(l, padL, 15 + i * size * 1.32));
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, toneMapped: false }));
  s.scale.set(W / 125, H / 125, 1); s.renderOrder = 10;
  return s;
}
const emissive = (color, i = 1.6) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: i, toneMapped: false });

// rooms: a platform, a carpet, glass walls with lit edges, a light of the team's colour
const rooms = {};
for (const [k, z] of Object.entries(ZONES)) {
  const g = new THREE.Group(); g.position.set(z.x, 0, z.z);
  const base = new THREE.Mesh(new THREE.BoxGeometry(z.w, 0.16, z.d), new THREE.MeshStandardMaterial({ color: 0x0b0e15, roughness: .8 }));
  base.position.y = 0.08; base.receiveShadow = true; base.userData.zone = k; g.add(base);
  const tint = new THREE.Color(0x0c1018).lerp(new THREE.Color(z.color), 0.05);
  const pad = new THREE.Mesh(new THREE.BoxGeometry(z.w - 0.5, 0.02, z.d - 0.5), new THREE.MeshStandardMaterial({ color: tint, roughness: .9, emissive: z.color, emissiveIntensity: 0.0 }));
  pad.position.y = 0.17; pad.receiveShadow = true; pad.userData.zone = k; g.add(pad);
  const rimMat = emissive(z.color, 0.9);
  for (const [w, d, x, zz] of [[z.w, .05, 0, z.d / 2], [z.w, .05, 0, -z.d / 2], [.05, z.d, z.w / 2, 0], [.05, z.d, -z.w / 2, 0]]) {
    const r = new THREE.Mesh(new THREE.BoxGeometry(w, .05, d), rimMat); r.position.set(x, .17, zz); g.add(r);
  }
  const glassMat = new THREE.MeshStandardMaterial({ color: z.color, transparent: true, opacity: 0.04, roughness: .1, metalness: .1, depthWrite: false, side: THREE.DoubleSide });
  const edgeMat = emissive(z.color, 0.55);
  for (const [w, x, zz, ry] of [[z.w, 0, -z.d / 2, 0], [z.d, -z.w / 2, 0, Math.PI / 2], [z.d, z.w / 2, 0, Math.PI / 2]]) {
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(w, 2.2), glassMat); wall.position.set(x, 1.27, zz); wall.rotation.y = ry; g.add(wall);
    const top = new THREE.Mesh(new THREE.BoxGeometry(w, .035, .035), edgeMat); top.position.set(x, 2.37, zz); top.rotation.y = ry; g.add(top);
  }
  const light = new THREE.PointLight(z.color, 0.4, 14, 2); light.position.set(0, 5, 0); g.add(light);
  const sign = label(z.name, { size: 44, accent: hex(z.color) });
  sign.position.set(-z.w / 2 + 2.1, 1.0, z.d / 2 - 0.3); g.add(sign);
  scene.add(g);
  rooms[k] = { group: g, pad, rimMat, light, flash: 0 };
}

// the reception: an eight-point star inlaid in the floor
{ const f = ZONES.front, mat = emissive(0xe8c77a, 0.75);
  for (const rot of [0, Math.PI / 4]) {
    const s = 2.2;
    for (let i = 0; i < 4; i++) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(s * 2, .03, .05), mat);
      const a = rot + i * Math.PI / 2;
      bar.position.set(f.x + Math.cos(a) * s, .2, f.z + 1.6 + Math.sin(a) * s); bar.rotation.y = -a + Math.PI / 2; scene.add(bar);
    }
  }
}

// plants make it an office
function plant(x, z) {
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(.32, .26, .55, 20), new THREE.MeshStandardMaterial({ color: 0x232a38, roughness: .6 }));
  pot.position.set(x, .44, z); pot.castShadow = true; scene.add(pot);
  const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(.55, 1), new THREE.MeshStandardMaterial({ color: 0x2f6b4f, roughness: .8, flatShading: true }));
  leaves.position.set(x, 1.15, z); leaves.scale.set(1, 1.25, 1); leaves.castShadow = true; scene.add(leaves);
}
for (const [k, z] of Object.entries(ZONES)) { plant(z.x + z.w / 2 - .8, z.z - z.d / 2 + .8); if (k === "front") plant(z.x - z.w / 2 + .8, z.z - z.d / 2 + .8); }

// records: filing cabinets that fill as documents are filed
const cabinets = [];
for (let i = 0; i < 3; i++) {
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.4, .85), new THREE.MeshStandardMaterial({ color: 0x232838, roughness: .5, metalness: .3 }));
  cab.position.set(ZONES.records.x - 3.6 + i * 1.75, 1.37, ZONES.records.z - 2.9); cab.castShadow = true; scene.add(cab);
  for (let d = 0; d < 3; d++) { const hd = new THREE.Mesh(new THREE.BoxGeometry(.4, .05, .05), emissive(0xd9b26f, .5)); hd.position.set(cab.position.x, .6 + d * .75, cab.position.z + .45); scene.add(hd); }
  cabinets.push(cab);
}
let filed = 0;
function fileBox(kind) {
  const colors = { invoice: 0xe8c77a, bill: 0xf0b35e, contract: 0x7ea6f8, receipt: 0x82d99f, form: 0x5ccfb5 };
  const b = new THREE.Mesh(new THREE.BoxGeometry(.4, .1, .58), emissive(colors[kind] || 0xcccccc, .45));
  const cab = cabinets[filed % 3], level = Math.floor(filed / 3);
  b.position.set(cab.position.x + ((filed % 2) ? .28 : -.28), 2.62 + level * .12, cab.position.z); scene.add(b); filed++;
}

// the WhatsApp screen at the front desk
const waCanvas = document.createElement("canvas"); waCanvas.width = 512; waCanvas.height = 340;
const waTex = new THREE.CanvasTexture(waCanvas);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 2.25), new THREE.MeshBasicMaterial({ map: waTex, toneMapped: false }));
wall.position.set(ZONES.front.x + 5.2, 2.1, ZONES.front.z - 3.3); scene.add(wall);
let waLines = [];
function drawWA() {
  const x = waCanvas.getContext("2d");
  x.fillStyle = "#0b1a14"; x.fillRect(0, 0, 512, 340);
  x.fillStyle = "#25d366"; x.font = "700 30px Inter, system-ui"; x.fillText("WhatsApp · Rania", 24, 46);
  waLines.slice(-4).forEach((l, i) => {
    const y = 76 + i * 64, me = l.me;
    x.fillStyle = me ? "#1f5c3d" : "#1b2621"; x.beginPath(); x.roundRect(me ? 120 : 20, y, 372, 52, 14); x.fill();
    x.fillStyle = "#e8f5ec"; x.font = "500 21px Inter, system-ui"; x.fillText(l.text.slice(0, 32), me ? 136 : 36, y + 33);
  });
  waTex.needsUpdate = true;
}
drawWA();
let wallGlow = 0;

// the Lobby board: every request people made, with who, due and status
const boardCanvas = document.createElement("canvas"); boardCanvas.width = 1024; boardCanvas.height = 640;
const boardTex = new THREE.CanvasTexture(boardCanvas);
const boardMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.6, 4.1), new THREE.MeshBasicMaterial({ map: boardTex, toneMapped: false }));

const orbs = [];
function send(from, to, color = 0xe8c77a) {
  const a = robots[from], b = robots[to]; if (!a || !b || from === to) return;
  const m = new THREE.Mesh(new THREE.SphereGeometry(.24, 20, 16), emissive(color, 3));
  const trail = Array.from({ length: 8 }, (_, i) => { const t = new THREE.Mesh(new THREE.SphereGeometry(.16 - i * .016, 10, 8), emissive(color, 2)); t.material.transparent = true; t.material.opacity = .5 - i * .05; scene.add(t); return t; });

function play(e, quiet = false) {
  byId.set(e.id, e);
  const who = agentOf(e);
  const cause = e.caused_by && byId.get(e.caused_by);
  const from = cause && agentOf(cause);
  if (who) {
    if (from && from !== who) send(from, who, e.type === "check.raised" ? 0xf27d7d : e.type === "review.returned" ? 0xb591f3 : robots[from]?.color || 0xe8c77a);
    if (!quiet && !["agent.started", "chat.received", "fact.superseded"].includes(e.type)) say(who, describe(e));
  }
  if (e.type === "check.raised") rooms.comp.flash = 1;
  if (e.type === "task.withdrawn" || e.type === "review.returned" || e.type === "approval.refused") rooms[ZONE_OF[who] || "review"].flash = .6;
  if (e.type === "document.filed") fileBox(e.content.kind);
  if (e.type === "rounds.started") roundsWalk();
  if (e.type.startsWith("lobby.") || e.type === "task.done") drawBoard();

  if (e.type === "chat.sent") { waLines.push({ text: e.content.text, me: true }); drawWA(); }

// speaking: the clearest voice available, sentence by sentence, record ids left out of the speech
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = ["Samantha", "Google UK English Female", "Microsoft Aria Online (Natural) - English (United States)", "Karen", "Moira", "Serena"]
    .map((n) => vs.find((v) => v.name === n)).find(Boolean) || vs.find((v) => v.lang.startsWith("en") && /female/i.test(v.name)) || vs.find((v) => v.lang.startsWith("en")) || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
let speakingOnce = false;
function speak(text) {
  return new Promise((done) => {
    speechSynthesis.cancel();
    const clean = text.replace(/\s*\((?:[A-Z]+\d+[^)]*|ref [^)]*|permit [^)]*)\)/g, "").replace(/\[[A-Z]\d+\]/g, "").replace(/AED/g, "dirhams ");
    const parts = clean.match(/[^.!?]+[.!?]*/g) || [clean];
    let i = 0;
    speaking = true; setOrb();
    const finish = () => { speaking = false; setOrb(); done(); };
    const next = () => {
      if (i >= parts.length || (!talking && i > 0 && !speakingOnce)) return finish();
      const u = new SpeechSynthesisUtterance(parts[i++].trim());
      if (voice) u.voice = voice;
      u.rate = .98; u.pitch = 1.02; u.onend = next; u.onerror = next;
      speechSynthesis.speak(u);
    };
    next();
  });
}

async function ask(text) {

  renderNova();
  say("nova", r.text, 7);
  if (r.delegated_to) zoomTo("records", false);
  speakingOnce = !talking;
  await speak(r.text);
  if (talking) listen();
}

function listen(once = false) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("This browser can't listen. Type to Nova instead."); return; }
  recog = new SR(); recog.lang = "en-US"; recog.interimResults = false; recog.maxAlternatives = 1;
  listening = true; setOrb(); renderNova();
  recog.onresult = (ev) => {
    listening = false; setOrb();
    const t = ev.results[0][0].transcript;
    if (!once && /^(thanks|thank you|bye|stop|that's all)/i.test(t)) { convo.push({ from: "you", text: t }); stopTalk("Any time. I'll keep an eye on things."); }
    else ask(t);
  };
  recog.onerror = () => { listening = false; setOrb(); renderNova(); };
  recog.onend = () => { if (listening) { listening = false; setOrb(); renderNova(); } };
  recog.start();
}

}

  await post(`/api/meetings/${m.id}/consent?by=Karim%20Haddad`);
  say("scribe", "Karim: “Actually, forget my brother. I'll pay it all myself.”", 4);
  await post(`/api/meetings/${m.id}/turn`, { speaker: "customer", text: "Actually, forget my brother. I'll pay it all myself." });
}
let replaying = false;
async function replay() {
  if (replaying) return;
  replaying = true;
  const evs = await api("/api/events");
  for (const r of Object.values(robots)) { if (r.bubble) r.g.remove(r.bubble); r.bubble = null; }
  for (const e of evs) {
    if (["knowledge.added", "listing.added", "document.filed", "sale.closed"].includes(e.type)) { byId.set(e.id, e); continue; }
    play(e);
    await new Promise((ok) => setTimeout(ok, 650));
  }
  replaying = false;
}

// ---------- loop ----------
function resize() {
  const w = stage.clientWidth, hh = stage.clientHeight;
  renderer.setSize(w, hh); composer?.setSize(w, hh); camera.aspect = w / hh; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
const clock = new THREE.Clock();
(function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  for (const [id, r] of Object.entries(robots)) {
    r.bot.position.y = Math.sin(t * 1.8 + id.length) * .035 + (r.glow > 0 ? Math.abs(Math.sin(t * 9)) * .12 * r.glow : 0);
    r.eyeMat.emissiveIntensity = 2.2 + r.glow * 3 + (Math.sin(t * 3 + id.length * 2) > .97 ? -2 : 0);
    r.screen.material.emissiveIntensity = .35 + r.glow * .9;
    r.glow = Math.max(0, r.glow - dt * .5);
    if (r.bubble && (r.bubbleT -= dt) <= 0) { r.g.remove(r.bubble); r.bubble = null; }
    if (r.walk) {
      r.walk.t += dt / 1.4;
      const k = Math.min(1, Math.max(0, r.walk.t)), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
      r.g.position.lerpVectors(r.walk.from, r.walk.to, e);
      r.bot.rotation.z = Math.sin(t * 14) * .07;
      if (r.walk.t >= 1) { r.bot.rotation.z = 0; r.walk = r.walk.back ? { from: r.walk.to.clone(), to: r.home.clone(), t: -.6, back: false } : null; }
    }
  }
  for (const room of Object.values(rooms)) {
    room.pad.material.emissiveIntensity = room.flash * (.28 + Math.sin(t * 12) * .1);
    room.rimMat.emissiveIntensity = .9 + room.flash * 2.5;
    room.light.intensity = .4 + room.flash * 2.5;
    room.flash = Math.max(0, room.flash - dt * .25);
  }
  wall.scale.setScalar(1 + wallGlow * .04); wallGlow = Math.max(0, wallGlow - dt * .6);
  dust.rotation.y += dt * .01;
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i]; o.t += dt / 1.15;
    const k = Math.min(1, o.t), a = o.p0.clone().lerp(o.p1, k), b = o.p1.clone().lerp(o.p2, k);
    o.m.position.copy(a.lerp(b, k));
    o.hist.unshift(o.m.position.clone()); o.hist.length = Math.min(o.hist.length, 16);
    o.trail.forEach((s, j) => { const p = o.hist[j * 2]; if (p) s.position.copy(p); });
    if (k >= 1) { scene.remove(o.m); o.trail.forEach((s) => scene.remove(s)); orbs.splice(i, 1); }
  }
  if (fly) {
    fly.t += dt / (fly.dur || 1.2);
    const k = Math.min(1, fly.t), e = 1 - (1 - k) ** 3;
    camera.position.lerpVectors(fly.from, fly.to, e); controls.target.lerpVectors(fly.lookFrom, fly.lookTo, e);
    if (k >= 1) fly = null;
  }
  controls.update();
  composer ? composer.render() : renderer.render(scene, camera);
  requestAnimationFrame(tick);
})();

// ---------- start: the archive fills the cabinets, then live events animate the floor ----------
const past = await api("/api/events");
for (const e of past) {
  byId.set(e.id, e);
  if (e.type === "document.filed") fileBox(e.content.kind);
  if (e.type === "chat.received" || e.type === "chat.sent") waLines.push({ text: e.content.text, me: e.type === "chat.sent" });
}
drawWA();
renderZone(); updateHud(); drawBoard();
follow((evs) => evs.forEach((e) => play(e)), past.at(-1)?.id || 0);
window.__diwan = { robots, zoomTo, ask, play };
