<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwan Memory</title>
<link rel="stylesheet" href="app.css">
<style>
  main { max-width: 1800px; }
  .wrap { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
  .flowscroll { overflow-x: auto; border-radius: 12px; }
  .flowscroll .flow { min-width: 1120px; }
  @media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; } }
  svg { width: 100%; height: 720px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; touch-action: none; }
  .node text { font-size: 11px; fill: var(--ink); pointer-events: none; }
  .edge { stroke: var(--line); stroke-width: 1.4; }
  .edge.replaces { stroke: var(--bad); stroke-dasharray: 4 3; }
  .edge.rests_on, .edge.uses { stroke: var(--warn); }
  .edge.follows, .edge.part_of { stroke: #e8c77a; opacity: .7; }
  .edge.picked { stroke: var(--green, #5ccfb5); stroke-width: 2.4; }
  .edge.sent_back { stroke: var(--bad); stroke-dasharray: 4 3; }
  .edge.builds_on, .edge.informs { stroke: #f0b35e; stroke-dasharray: 2 3; }
  .edge.changes { stroke: var(--warn); stroke-dasharray: 2 3; }
  .edge.in_area { stroke: #8a7f6a; opacity: .5; }
  .edge.gone { opacity: .25; stroke-dasharray: 3 4; }  /* its statement was replaced */
  .edge.reports_to { stroke: var(--line-2); opacity: .55; }
  .edge.hands_to { stroke: #e8c77a; opacity: .85; fill: none; }
  .legend span { margin-right: 10px; }
  .agentbox label { font-size: 11px; color: var(--muted); display: block; margin: 8px 0 3px; }
  .agentbox textarea { min-height: 64px; }
  #play { flex: 0 0 auto; }
  svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: none; border-radius: 0; pointer-events: none; z-index: 0; }
  .colhead { font: 600 10.5px var(--font); letter-spacing: 1px; text-transform: uppercase; fill: var(--muted); }
  .colline { stroke: var(--line); stroke-dasharray: 2 4; }
  .edge.dim { opacity: .08; }
  .node.dim { opacity: .3; }
  /* the agents view: departments as cards, flows as numbered arrows between them */
  .flow { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .flow .grid { display: grid; grid-template-columns: 112px 1fr 1.15fr 1fr 1fr; gap: 54px; align-items: start; position: relative; z-index: 1; margin-top: 46px; }
  .flow .stack { display: flex; flex-direction: column; gap: 14px; }
  .dept { border: 1px solid var(--line-2); border-radius: 12px; background: #16181d; padding: 10px 12px; cursor: pointer; position: relative; z-index: 1; }
  .dept:hover, .dept.on { border-color: #e8c77a; }
  .dept h3 { margin: 0; font-size: 13px; display: flex; gap: 7px; align-items: center; }
  .dept .what { font-size: 11.5px; color: var(--muted); margin: 4px 0 6px; line-height: 1.4; }
  .dept .ag { display: flex; gap: 7px; align-items: center; font-size: 12px; padding: 4px 0; border-top: 1px solid var(--line); }
  .dept .ag:hover { color: #e8c77a; }
  .dept .ag .n { margin-left: auto; font-size: 10.5px; color: var(--faint); }
  .dept .ag.quiet { opacity: .5; }
  .key { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 0 0 4px; position: relative; z-index: 2; }
  .key b { color: var(--ink); font-weight: 600; }
  .key button { font-size: 11.5px; padding: 3px 10px; margin-left: auto; }
  .flow .dept > h3 { cursor: grab; user-select: none; } .flow .dept.dragging { z-index: 6; box-shadow: 0 14px 40px #000a; cursor: grabbing; }
  .dept .ag.custom .adot { box-shadow: 0 0 0 2px #e8c77a; }
  .dept details summary { font-size: 12px; padding: 4px 0; border-top: 1px solid var(--line); cursor: pointer; color: var(--muted); }
  .dept details .ag { padding-left: 12px; }
  .dept .ag.head { font-weight: 600; } .dept .ag.head .adot { box-shadow: 0 0 0 2px #e8c77a66; }
  .dept .ag.sub { padding-left: 16px; } .dept .ag.sub::before { content: "↳"; color: var(--faint); margin-right: -2px; }
  .zoom .zn.sub { margin-left: 22px; } .zoom .zn.head { border-color: #e8c77a; }
  .adot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .dept .add { font-size: 11px; padding: 3px 9px; margin-top: 8px; }
  .nova { max-width: 520px; margin: 0 auto; }
  .flows { margin-top: 22px; position: relative; z-index: 1; }
  .flows h2 { margin: 0 0 8px; }
  .fl { display: grid; grid-template-columns: 26px 210px 1fr auto; gap: 10px; align-items: start; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
  .fl:hover { color: #e8c77a; }
  .badge { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--font); background: #e8c77a; color: #1b1608; }
  .badge.off { background: var(--line-2); color: var(--ink); }
  .badge.plan { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
  .panelsec { margin-top: 14px; }
  .panelsec .ag { font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
  dl.ch { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; font-size: 12.5px; margin: 8px 0 0; }
  dl.ch dt { color: var(--muted); font-size: 11.5px; } dl.ch dd { margin: 0; }
  #find { max-width: 220px; }
  .wrap > div { min-width: 0; }
  @media (max-width: 1000px) { .flow .grid { grid-template-columns: 1fr; gap: 14px; } svg.arrows { display: none; }
    .fl { grid-template-columns: 26px 1fr; } .fl > :nth-child(n+3) { grid-column: 2; } }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
  .tabs button { border-radius: 999px; padding: 7px 14px; }
  .tabs button.on { background: #e8c77a; color: #1b1608; border-color: #e8c77a; }
  svg.alinks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; overflow: visible; }
  .flow.linking .dept .ag { opacity: .35; }
  .flow.linking .dept .ag.me, .flow.linking .dept .ag.hl { opacity: 1; }
  .dept .ag.me { color: #e8c77a; font-weight: 600; }
  .dept .ag.hl { color: #fff; background: #e8c77a1a; border-radius: 6px; }
  .dept .ag.me, .dept .ag.hl.me { color: #1b1608; background: #e8c77a; border-radius: 6px; opacity: 1; }
  .zoom { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 70px; position: relative; padding: 8px 4px; }
  .zoom h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .zoom .zn { border: 1px solid var(--line-2); border-radius: 10px; background: #16181d; padding: 8px 10px; margin-bottom: 10px; font-size: 12.5px; cursor: pointer; position: relative; z-index: 3; }
  .zoom .zn:hover { border-color: #e8c77a; }
  .zoom .zn .muted { font-size: 11.5px; margin-top: 2px; }
  .zoom .mid .zn { border-color: #e8c77a66; }
  .scen { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .scen button { border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .scen button.on { border-color: #e8c77a; color: #e8c77a; }
  .scen button.none { opacity: .55; }
  .steps { margin: 10px 0 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; padding: 7px 8px 7px 30px; border-top: 1px solid var(--line); font-size: 12.5px; position: relative; cursor: pointer; }
  .steps li::before { content: counter(s); position: absolute; left: 6px; top: 8px; width: 18px; height: 18px; border-radius: 50%; background: #2a2d35; font-size: 10.5px; display: grid; place-items: center; }
  .steps li.on { background: #e8c77a1a; border-radius: 8px; } .steps li.on::before { background: #e8c77a; color: #1b1608; }
  .steps li.done { opacity: .6; }
  .steps .by { color: var(--muted); font-size: 11.5px; }
  .addline { position: absolute; transform: translate(-50%, -50%); z-index: 4; width: 22px; height: 22px; border-radius: 50%; padding: 0; line-height: 20px;
    font-size: 15px; border: 1px solid #e8c77a; background: #16181d; color: #e8c77a; cursor: pointer; opacity: .45; transition: opacity .15s, transform .15s; }
  .addline:hover { opacity: 1; transform: translate(-50%, -50%) scale(1.15); background: #e8c77a; color: #1b1608; }
  .ck { font-size: 10px; border-radius: 999px; padding: 1px 6px; margin-left: 4px; font-weight: 700; }
  .ck.worked { background: #25a35a33; color: #5fd08b; } .ck.needs { background: #e8c77a26; color: #e8c77a; } .ck.notreached { background: #d05a5f33; color: #f08a8e; }
  .scen button.check { border-color: #5fd08b66; }
  .cklist div { padding: 5px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .bridge { position: absolute; transform: translate(-50%, -50%); z-index: 3; font-size: 11.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid #e8c77a; background: #16181d; cursor: pointer; white-space: nowrap; }
  .bridge:hover, .bridge.me { background: #e8c77a; color: #1b1608; }
  .zbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  @media (max-width: 1000px) { .zoom { grid-template-columns: 1fr; gap: 14px; } svg.alinks { display: none; } }
</style>
</head>
<body>
<main>
  <h1>The office&rsquo;s <em>memory</em></h1>
  <p class="sub" id="sub">The office's memory, rebuilt from the event log. Drag the slider to rewind and watch a correction rewire the office.</p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="scen" id="scen" style="display:none"></div>
  <div class="row" style="margin-bottom:12px" id="controls">
    <select id="deal" style="max-width:260px"></select>
    <input id="find" list="deallist" placeholder="Find a deal: customer or property"><datalist id="deallist"></datalist>
    <button id="play" title="Play the history from the start">▶ Play</button>
    <input type="range" id="upto" min="1" value="1">
    <span id="at" class="small muted" style="flex:0 0 150px"></span>
  </div>
  <div class="wrap">
    <div><svg id="svg"></svg><div class="flowscroll"><div id="flow" class="flow" hidden></div></div></div>
    <aside class="panel">
      <div id="recbox">
      <h2>Record</h2>
      <p id="record" class="muted">Click any node.</p>
      <h2 style="margin-top:16px">Links</h2>
      <div id="links" class="small"></div>
      <div class="legend small muted" id="legend" style="margin-top:16px"></div>
      </div>
      <div class="agentbox" id="agentbox" hidden></div>
    </aside>
  </div>
</main>
<script type="module">
import { h, api, post, header, follow, toast, NAMES, describe } from "./app.js";
header("graph.html");
const $ = (id) => document.getElementById(id);
const COLORS = { person: "#5b7bd5", deal: "#1d1c1a", property: "#8a7f6a", fact: "#0f8a6f", task: "#c27c1a", approval: "#7a4fc4",
  slide: "#b5527e", draft: "#b5527e", decision: "#a4262c", check: "#a4262c", question: "#d18b2a", request: "#7a4fc4",
  chat: "#25a35a", viewing: "#2d8fb5", listing: "#8a7f6a", knowledge: "#6b6860",
  brand: "#e8c77a", idea: "#c58fe0", script: "#f08fc0", angle: "#5ccfb5", trend: "#f0b35e", outlier: "#f27d7d", competitor: "#8b92a3", post: "#82d99f", lesson: "#d9b26f", source: "#4f7cac", version: "#6b6860", proposal: "#f0b35e" };
const MKT = "__marketing", KN = "__knowledge", AG = "__agents";
const isMkt = () => $("deal").value === MKT;
const isKn = () => $("deal").value === KN;
const isAg = () => $("deal").value === AG;
const SHOW = new Set(["person", "deal", "fact", "task", "approval", "slide", "draft", "decision", "check", "question", "request", "chat", "viewing", "listing"]);
const DEAD = ["superseded", "withdrawn", "refused", "sent_back", "cancelled", "retired", "replaced", "rejected", "removed"];
// the agents view: one colour per department
const DEPT = { nova: ["#e8c77a", "Nova"], sales: ["#25a35a", "Front desk & sales"], comp: ["#d05a5f", "Compliance"], fin: ["#c27c1a", "Finance"],
  ops: ["#2d8fb5", "Operations"], review: ["#9a6fe0", "Review"], records: ["#a89c84", "Records"], mkt: ["#f08fc0", "Marketing"] };
let steps = null;  // a deal's own event ids: the slider steps through these
let data = { nodes: [], edges: [] }, pos = {}, selected = null, live = true;
const SUB = document.getElementById("sub").textContent;

function legend() {
  if (isAg()) {
    $("legend").replaceChildren(...Object.values(DEPT).map(([c, l]) => h("span", {}, h("span", { class: "sw", style: `background:${c}` }), l)),
      h("div", { style: "margin-top:6px" }, "Click an agent to draw its links. Gold: a handoff the log shows, with how often (thicker = more). Grey dashed: who checks its work, or who it reports to. Faded: has not acted yet. Gold ring: an agent you added."));
    return;
  }
  const present = new Set(data.nodes.map((n) => n.type));
  $("legend").replaceChildren(...Object.entries(COLORS).filter(([k]) => present.has(k)).map(([k, c]) => h("span", {}, h("span", { class: "sw", style: `background:${c}` }), k)));
}

let dealList = [];
async function deals() {
  dealList = (await api("/api/deals")).reverse();  // newest first
  const keep = $("deal").value;
  $("deal").replaceChildren(h("option", { value: AG }, "Agents · how the office works"), h("option", { value: MKT }, "Marketing & brand"), h("option", { value: KN }, "Knowledge & catalog"),
    h("optgroup", { label: `Deals (${dealList.length}, newest first)` }, ...dealList.map((d) => h("option", { value: d.deal }, `${d.label} · ${d.props.customer}`))));
  $("deallist").replaceChildren(...dealList.map((d) => h("option", { value: `${d.label} · ${d.props.customer}` })));
  const view = new URLSearchParams(location.search).get("view"), want = new URLSearchParams(location.search).get("deal");
  if (keep && (keep === MKT || keep === KN || keep === AG || dealList.some((d) => d.deal === keep))) $("deal").value = keep;
  else if (want && dealList.some((d) => d.deal === want)) $("deal").value = want;
  else if (view === "marketing") $("deal").value = MKT;
  else if (view === "knowledge") $("deal").value = KN;
  else $("deal").value = AG;  // How the office works comes first
}

// the slider: a deal view steps through that deal's own events; the other views through the whole log
const slideTo = (v) => steps?.length ? steps[Math.min(steps.length, Math.max(1, v)) - 1] : v;
function setSlider(upto, last) {
  if (steps?.length) {
    if (!upto) { $("upto").max = steps.length; $("upto").value = steps.length; }
    const i = upto ? steps.filter((x) => x <= upto).length : steps.length;
    $("at").textContent = `step ${i} of ${steps.length} in this deal`;
  } else {
    if (!upto) { $("upto").max = last; $("upto").value = last; }
    $("at").textContent = `event ${upto || last} of ${$("upto").max}`;
  }
}
// the four views as tabs; the deal picker only shows on a deal's story
let lastDeal = null;
function tabs() {
  const v = $("deal").value, isDeal = ![AG, MKT, KN].includes(v);
  if (isDeal) lastDeal = v;
  const go = (val) => { if (val && $("deal").value !== val) { $("deal").value = val; $("deal").onchange(); } };
  $("tabs").replaceChildren(...[[AG, "How the office works"], [lastDeal || dealList[0]?.deal, "A deal's story"], [MKT, "Marketing"], [KN, "Knowledge"]]
    .filter(([val]) => val).map(([val, label]) => h("button", { role: "tab", class: (val === v || (label === "A deal's story" && isDeal)) ? "on" : "", "aria-selected": String(val === v), onclick: () => go(val) }, label)));
  $("deal").style.display = isDeal ? "" : "none";
}
async function load(upto) {
  tabs();
  const ag = isAg();
  $("svg").style.display = ag ? "none" : ""; $("flow").hidden = !ag; $("recbox").hidden = ag; $("agentbox").hidden = !ag;
  $("find").hidden = isMkt() || isKn() || ag;
  $("controls").style.display = ag ? "none" : ""; $("scen").style.display = ag ? "" : "none";
  if (ag) {
    steps = null;
    flow = await api(`/api/memory/flow${upto ? `?upto=${upto}` : ""}`);
    $("sub").textContent = "Every department, its agents and what passes between them. Click an agent to see its links, pick a scenario to watch one run, or use + to add an agent to a team or on a line between two teams.";
    setSlider(upto, flow.last_event); renderFlow();
    if (!editing) sidePanel();  // never wipe a form someone is filling in
    return;
  }
  const q = new URLSearchParams(isMkt() || isKn() ? {} : { deal: $("deal").value });
  if (upto) q.set("upto", upto);
  if (isMkt() || isKn()) {
    steps = null;
    data = await api(`/api/memory/${isKn() ? "knowledge" : "marketing"}?${q}`);
    $("sub").textContent = isKn() ? "What the agents may know: every item, the versions an edit replaced (red dashed line), retired items dimmed with their reason, changes waiting for an owner, and each area guide's listings."
      : "The marketing team's memory: the brand and what it was drafted from, the research it built on, every script with its angle, who picked or sent it back. Rewind to see how it grew.";
    setSlider(upto, data.last_event);
    legend(); layout(); return;
  }
  $("sub").textContent = "One deal as a story, left to right: who said it, what they said (their exact words), what the office built on it, and the checks and decisions. A replaced statement sits under the one that replaced it. Click anything to light up its links; drag the slider or press Play to watch it happen.";
  data = await api(`/api/graph?${q}`);
  if (!upto) steps = data.steps;
  setSlider(upto, data.last_event);
  storyLayout(); legend();
}

// ---------- a deal as a story: who said it → what they said → what was built on it → checks and decisions ----------
const WIDTH = [0.62, 1.3, 1.22, 1];  // "who" needs little room; what was said needs the most
const COLS = [["Who", ["person"]], ["What they said", ["fact"]], ["What the office built on it", ["task", "approval", "draft", "slide", "chat", "viewing"]],
  ["Checks and decisions", ["check", "decision", "question", "request"]]];
const colOf = (n) => COLS.findIndex(([, ts]) => ts.includes(n.type));
let story = null;
function storyLayout() {
  const deal = $("deal").value;
  data.nodes = data.nodes.filter((n) => colOf(n) >= 0 && (n.deal === deal || n.type === "person"));
  const same = {};
  for (const n of data.nodes.filter((n) => n.type === "person")) { const k = (n.label || "").toLowerCase(); if (same[k] && same[k] !== n.id) same[n.id] = same[k]; else same[k] = n.id; }
  const one = (id) => same[id] || id;
  data.nodes = data.nodes.filter((n) => !same[n.id] || n.type !== "person" || same[n.id] === n.id);
  data.edges = data.edges.map((e) => ({ ...e, src: one(e.src), dst: one(e.dst) })).filter((e) => e.src !== e.dst);
  const ids = new Set(data.nodes.map((n) => n.id));
  data.edges = data.edges.filter((e) => ids.has(e.src) && ids.has(e.dst));
  const own = new Set(data.nodes.filter((n) => n.type !== "person").map((n) => n.id));
  // a person belongs to this deal through its own items, or through a relation the customer stated in it ("my brother Tariq")
  const linked = new Set(data.edges.filter((e) => own.has(e.src) || own.has(e.dst) || own.has(e.via)).flatMap((e) => [e.src, e.dst]));
  data.nodes = data.nodes.filter((n) => n.type !== "person" || linked.has(n.id));
  const kept = new Set(data.nodes.map((n) => n.id));
  data.edges = data.edges.filter((e) => kept.has(e.src) && kept.has(e.dst));
  const byId = Object.fromEntries(data.nodes.map((n) => [n.id, n])), ev = (n) => n.event || 0;
  const out = (id, rel) => data.edges.filter((e) => e.src === id && rel.includes(e.rel)).map((e) => e.dst);
  const into = (id, rel) => data.edges.filter((e) => e.dst === id && rel.includes(e.rel)).map((e) => e.src);
  const rows = [[], [], [], []], row = {};
  const put = (c, n, indent = 0) => { if (row[n.id] !== undefined) return; row[n.id] = rows[c].length; rows[c].push([n, indent]); };
  // what they said: live statements in order, each replaced one right under the statement that replaced it
  const facts = data.nodes.filter((n) => n.type === "fact").sort((a, b) => ev(a) - ev(b));
  const under = (f, d) => { put(1, f, d); for (const old of out(f.id, ["replaces"]).map((i) => byId[i]).filter(Boolean)) under(old, d + 1); };
  for (const f of facts.filter((f) => !into(f.id, ["replaces"]).length)) under(f, 0);
  // who: the customer first, then in order of their first statement
  const people = data.nodes.filter((n) => n.type === "person").sort((a, b) => (a.props?.role === "Customer" ? -1 : 0) - (b.props?.role === "Customer" ? -1 : 0) || ev(a) - ev(b));
  for (const n of people) put(0, n);
  // what was built: next to the first statement it rests on; slides under their deck
  const anchor = (n) => Math.min(99, ...out(n.id, ["rests_on", "uses"]).map((f) => row[f] ?? 99), ...into(n.id, ["part_of"]).flatMap((s) => out(s, ["uses"]).map((f) => row[f] ?? 99)));
  const built = data.nodes.filter((n) => colOf(n) === 2 && n.type !== "slide").sort((a, b) => anchor(a) - anchor(b) || ev(a) - ev(b));
  for (const n of built) { put(2, n); for (const sl of into(n.id, ["part_of"]).map((i) => byId[i]).filter(Boolean).sort((a, b) => (a.props?.n || 0) - (b.props?.n || 0))) put(2, sl, 1); }
  for (const n of data.nodes.filter((n) => n.type === "slide")) put(2, n, 1);
  for (const n of data.nodes.filter((n) => colOf(n) === 3).sort((a, b) => ev(a) - ev(b))) put(3, n);
  const W = $("svg").clientWidth, unit = (W - 30) / WIDTH.reduce((a, b) => a + b), RH = 30, TOP = 62;

        h("label", {}, "Hands its work to"), f.to,
        h("button", { class: "primary", id: "addagent", style: "margin-top:10px", onclick: async () => {
          try { const r = await post("/api/agents/custom", { by: me, name: f.name.value, role: f.role.value, produces: f.produces.value, reports_to: f.boss.value, ai: f.ai.value === "1", job: f.job.value, trigger: f.trigger.value, team: f.team.value, to: f.to.value });
            toast(`${r.name} added: it listens from now on`); focus = { agent: r.id }; editing = false; await load(); }
          catch (e) { toast(e.message); } } }, "Add agent"))];
    for (const x of [f.name, f.job, f.role, f.produces]) x.oninput = () => { editing = !!(f.name.value || f.job.value); };
  }
  $("agentbox").replaceChildren(as, ...(body || []).filter(Boolean));
  if (!focus?.zoom) { drawAgentLinks(); if (!focus) drawScenario(); }
  document.querySelectorAll(".bridge").forEach((x) => x.classList.toggle("me", x.dataset.agent === focus?.agent));
}

// ▶ Play: the history rebuilds by itself, like a film of the office
let playing = false;
$("play").onclick = async () => {
  if (playing) { playing = false; return; }
  playing = true; live = false; $("play").textContent = "❚❚ Pause";
  const max = +$("upto").max, step = Math.max(1, Math.ceil(max / 90));
  for (let v = steps?.length ? 1 : Math.max(1, max - step * 90); v <= max && playing; v += step) {
    $("upto").value = v; await load(slideTo(v)); await new Promise((r) => setTimeout(r, steps?.length ? 450 : 120));
  }
  if (playing) { $("upto").value = max; live = true; await load(); }
  playing = false; $("play").textContent = "▶ Play";
};
$("deal").onchange = () => { pos = {}; playing = false; selected = null; focus = null; editing = false; $("find").value = ""; load(); };
$("find").onchange = () => {
  const q = $("find").value.trim().toLowerCase();
  const d = dealList.find((x) => `${x.label} · ${x.props.customer}`.toLowerCase() === q) || dealList.find((x) => `${x.label} ${x.props.customer}`.toLowerCase().includes(q));
  if (d) { $("deal").value = d.deal; $("deal").onchange(); $("find").value = `${d.label} · ${d.props.customer}`; } else toast("No deal matches");
};
$("upto").oninput = () => { live = +$("upto").value === +$("upto").max; load(live ? undefined : slideTo(+$("upto").value)); };
await deals();
await load();
await scenarios();
follow(() => { if (live) { deals(); load(); } });
</script>
</body>
