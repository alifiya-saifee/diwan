<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwan Deal desk</title>
<link rel="stylesheet" href="app.css">
<style>
  /* three views of the same deals (Overview · My work · Deals); one deal opens in a side panel, never a new page */
  .deskbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .views { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .views a { color: var(--muted); padding: 7px 14px; border-radius: 9px; font-weight: 500; display: flex; gap: 8px; align-items: center; }
  .views a.on { background: var(--gold); color: var(--bg); }
  .views a .n { font: 600 11px var(--mono); background: var(--bad); color: #1b0b0b; border-radius: 99px; padding: 0 6px; }
  .views a.on .n { background: var(--bg); color: var(--gold); }
  .actas { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .actas select { width: auto; min-width: 170px; }
  .lede { color: var(--muted); margin: -2px 0 20px; max-width: 70ch; }
  .num { font-variant-numeric: tabular-nums; }
  /* overview */
  .story { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
  .correction { border-color: rgba(232, 199, 122, .35); background: linear-gradient(135deg, rgba(232, 199, 122, .10), var(--panel) 55%); }
  .correction .was { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); font-family: var(--display); font-style: italic; font-size: 17px; }
  .correction .now { font: italic 400 26px/1.25 var(--display); margin: 4px 0; text-wrap: balance; }
  .ripple { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
  .ripple div { border-radius: 12px; padding: 10px 12px; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); }
  .ripple b { display: block; font-size: 22px; } .ripple .first b { color: var(--bad); }
  .ripple span { font-size: 12px; color: var(--muted); }
  .clist .ci { display: flex; justify-content: space-between; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .clist .ci:hover { background: rgba(255, 255, 255, .03); }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
  .tile { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .tile .k { font: 600 11px var(--font); letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .tile .big { font: 400 38px/1 var(--display); }
  .tile .r { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .tile .r:hover { background: rgba(255, 255, 255, .05); } .tile .r b { font-variant-numeric: tabular-nums; }
  .tile .r.zero { color: var(--faint); cursor: default; } .tile .r.zero:hover { background: none; }
  .charts { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
  svg text { fill: var(--muted); font: 11px var(--font); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .stage { display: grid; grid-template-columns: 110px minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 7px 4px; font-size: 13px; cursor: pointer; border-radius: 8px; }
  .stage:hover { background: rgba(255, 255, 255, .03); }
  .stage .bar { height: 14px; background: rgba(255, 255, 255, .04); border-radius: 99px; overflow: hidden; display: flex; }
  .stage .bar i { display: block; height: 100%; background: var(--gold); } .stage .bar i + i { opacity: .35; }
  .stage .v { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (max-width: 1100px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .story, .charts { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } .ripple { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* my work */
  .people { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .person { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 99px; }
  .person .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12px; background: var(--raise); color: var(--gold); }
  .person.on { border-color: var(--gold); background: var(--gold-soft); }
  .person small { display: block; color: var(--muted); font-size: 11px; line-height: 1.1; text-align: left; }
  .qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .qhead .big { font: 400 32px var(--display); }
  .groups { display: flex; gap: 6px; flex-wrap: wrap; }
  .groups button, .filters button { padding: 5px 12px; font-size: 12px; border-radius: 99px; color: var(--muted); background: transparent; }
  .groups button.on, .filters button.on { color: var(--gold); background: var(--gold-soft); border-color: rgba(232, 199, 122, .4); }
  .q { display: grid; grid-template-columns: 5px minmax(0, 1fr) auto; gap: 14px; padding: 13px 14px 13px 0; border-bottom: 1px solid var(--line); align-items: center; transition: opacity .3s, transform .3s; }
  .q .sev { align-self: stretch; border-radius: 0 4px 4px 0; }
  .q .title { font-weight: 600; } .q .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 3px; align-items: center; }
  .q .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .q .acts input { width: 170px; padding: 7px 10px; font-size: 13px; }
  .q.gone { opacity: 0; transform: translateX(24px); }
  @media (max-width: 760px) { .q { grid-template-columns: 5px minmax(0, 1fr); } .q .acts { grid-column: 2; justify-content: flex-start; } }
  .allclear { padding: 40px 10px; text-align: center; color: var(--muted); } .allclear b { display: block; font: 400 26px var(--display); color: var(--ink); }
  /* deals table */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input { flex: 1 1 240px; width: auto; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .tablebox table { min-width: 1040px; }
  .tablebox th { cursor: pointer; white-space: nowrap; user-select: none; } .tablebox th.on { color: var(--gold); }
  .tablebox td { white-space: nowrap; vertical-align: middle; }
  .tablebox tbody tr { cursor: pointer; } .tablebox tbody tr:hover { background: rgba(255, 255, 255, .03); } .tablebox tbody tr.sel { background: var(--gold-soft); }
  .tablebox .sub { color: var(--muted); font-size: 12px; }
  .steps { display: inline-flex; gap: 3px; vertical-align: middle; } .steps i { width: 8px; height: 8px; border-radius: 2px; background: rgba(255, 255, 255, .1); } .steps i.f { background: var(--teal); }
  .pager { display: flex; justify-content: space-between; align-items: center; padding: 12px 2px; color: var(--muted); font-size: 13px; gap: 8px; flex-wrap: wrap; }
  /* the deal panel (today's deal page, unchanged inside) */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 40; }
  aside.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); z-index: 41; background: var(--bg-2); border-left: 1px solid var(--line-2);
    overflow-y: auto; padding: 18px 22px 96px; box-shadow: -30px 0 60px -20px rgba(0, 0, 0, .7); }
  .drawer .closebtn { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; padding: 0; }
  .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
  .strip div { border-radius: 12px; padding: 9px 10px; border: 1px solid var(--line); font-size: 13px; }
  .strip div b { display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
  .strip .ok { border-color: rgba(130, 217, 159, .3); } .strip .warn { border-color: rgba(240, 179, 94, .4); background: var(--warn-soft); } .strip .bad { border-color: rgba(242, 125, 125, .4); background: var(--bad-soft); }
  @media (max-width: 520px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } aside.drawer { padding: 16px; } }
  .tl { position: relative; margin: 6px 0 4px; padding-left: 18px; }
  .tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line-2); }
  .tl div { position: relative; padding: 5px 0; font-size: 13px; }
  .tl div::before { content: ""; position: absolute; left: -17px; top: 11px; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
  .tl div.hot::before { background: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); }
  .tl time { color: var(--faint); font: 11px var(--mono); margin-right: 6px; }
  .said { display: flex; flex-direction: column; gap: 6px; }
  .said .f { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); }
  .said .f.superseded { opacity: .6; }
  .said .f.superseded .quote { text-decoration: line-through; text-decoration-color: var(--bad); }
  .said .f.new { border-color: rgba(232, 199, 122, .45); background: var(--gold-soft); }
  .fid { font: 600 12px var(--mono); color: var(--gold-2); padding-top: 2px; }
  section.dept { margin-top: 18px; }
  section.dept > h2 { display: flex; gap: 8px; align-items: center; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; background: rgba(255, 255, 255, .02); }
  .card.open { border-color: rgba(240, 179, 94, .4); background: var(--warn-soft); }
  .card.mine { box-shadow: 0 0 0 1px rgba(232, 199, 122, .5) inset; }
  .card .top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
  .card .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .card .acts input { flex: 1 1 100%; }
  .rests { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .rests .x { color: var(--bad); }
  .done { opacity: .62; }
  .slides { margin: 8px 0 0; padding-left: 18px; }
  .slides li.stale { color: var(--bad); }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .head h1 { font-size: 30px; margin: 0 40px 0 0; overflow-wrap: anywhere; }
  .rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 18px; margin-top: 12px; }
  label.rule { display: grid; gap: 4px; font-size: 12px; color: var(--muted); margin: 0; }
  label.rule strong { color: var(--ink); font-size: 14px; }
  .rsteps { display: flex; flex-direction: column; gap: 6px; }
  .rstep { display: grid; grid-template-columns: 18px minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .rstep input { padding: 6px 10px; font-size: 13px; }
  .rstep button { padding: 4px 10px; }
  @media (max-width: 640px) { .rstep { grid-template-columns: 18px minmax(0, 1fr); } .rstep > :nth-child(3), .rstep > :nth-child(4) { grid-column: 2; } }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .kpis .tile { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .kpis .tile .big { font-size: 32px; }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .kpis { grid-template-columns: 1fr; } }
  .stagebar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 12px 0 4px; }
  .stagebar button { padding: 3px 10px; font-size: 12px; border-radius: 99px; color: var(--muted); background: transparent; }
  .stagebar button.past { color: var(--teal); border-color: rgba(130, 217, 159, .3); }
  .stagebar button.on { background: var(--gold); color: var(--bg); border-color: var(--gold); font-weight: 600; }
  .stagebar .end { font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1px dashed var(--line-2); color: var(--muted); }
  .stagebar .end.on { border-style: solid; border-color: rgba(130, 217, 159, .5); color: var(--teal); }
  .stagebar .lost { margin-left: auto; color: var(--bad); }
  .views { flex-wrap: wrap; }
  .gates { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
  .gates div { border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
  .gates div b { display: block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .gates .ok { border-color: rgba(130, 217, 159, .4); } .gates .no { border-color: rgba(240, 179, 94, .4); background: var(--warn-soft); }
  @media (max-width: 560px) { .gates { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; align-items: flex-start; }
  .bcol { flex: 0 0 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .bcol h3 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; }
  .bcard { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  .bcard:hover { background: rgba(255, 255, 255, .04); } .bcard small { display: block; color: var(--muted); }
  .rgridp { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; align-items: start; }
  .rrow { display: flex; justify-content: space-between; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 13px; align-items: baseline; flex-wrap: wrap; }
  .rrow.link { cursor: pointer; } .rrow.link:hover { background: rgba(255, 255, 255, .03); }
  .sidebyside { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .sidebyside .o { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); }
  .bigs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
  .bigs .big { font: 400 32px/1.1 var(--display); display: block; }
  @media (max-width: 640px) { .bigs { grid-template-columns: 1fr; } }
  details.quiet > summary { cursor: pointer; color: var(--muted); font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 600; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <div class="deskbar">
    <h1 style="margin:0">The <em>Deal desk</em></h1>
    <nav class="views" id="views" aria-label="Deal desk views">
      <a href="#overview" data-v="overview">Overview</a><a href="#my-work" data-v="my-work">My work <span class="n" id="mycount"></span></a><a href="#deals" data-v="deals">Deals</a><a href="#board" data-v="board">Board</a><a href="#compliance" data-v="compliance">Compliance</a><a href="#finance" data-v="finance">Finance</a><a href="#operations" data-v="operations">Operations</a>
    </nav>
    <label class="actas" for="as">Acting as <select id="as"></select></label>
  </div>
  <div id="view"></div>
  <div id="drawerRoot" hidden><div class="scrim" id="scrim"></div>
    <aside class="drawer" role="dialog" aria-label="Deal"><button class="closebtn" id="close" aria-label="Close">✕</button><div id="main"></div></aside></div>
</main>
<script type="module">
import { h, api, post, follow, header, describe, who, loadAgents, time, NAMES, toast, SESSION } from "./app.js";
header("deal.html");
await loadAgents();
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let deal = new URLSearchParams(location.search).get("deal"), view = null;
let dirty = false;  // something typed in the deal and not sent yet: a refresh would wipe it, even after the focus has moved to a button
let filter = new URLSearchParams(location.search).get("filter") || "", stage = "", query = "", sort = "changed", desc = true, page = 1, group = "all";
$("as").replaceChildren(...Object.entries(NAMES).map(([k, v]) => h("option", { value: k }, v)));
// who holds each Deal desk role comes from the office's settings, never from a name in this page
let ROLES = await api("/api/desk/roles");
const TEAM = await api("/api/people"), OWNER = Object.keys(TEAM).find((k) => TEAM[k].role === "Owner");
const R = (role) => ROLES.find((r) => r.role === role) || {};
const holds = (role) => !!R(role).holder && R(role).holder === (SESSION.auth ? SESSION.person : me());  // signed in, the owner can look through someone's eyes but acts as herself
const rname = (role) => R(role).holder_name || `the ${R(role).title?.toLowerCase() || role} (nobody assigned)`;
$("as").value = (SESSION.auth && SESSION.person) || store.get("desk.as") || R("compliance").holder || Object.keys(NAMES)[0];  // signed in, everyone starts as themselves
$("as").onchange = () => { store.set("desk.as", $("as").value); render(); show(); };
const me = () => $("as").value;
const seesCompliance = !SESSION.auth || SESSION.owner || SESSION.department === "comp";
if (SESSION.auth && !SESSION.owner) {  // the rooms a department doesn't have are not offered (the server refuses them anyway)
  const dept = SESSION.department, rooms = { compliance: ["comp"], finance: ["fin", "comp"], operations: ["ops", "comp"] };
  for (const [v, may] of Object.entries(rooms)) if (!may.includes(dept)) document.querySelector(`#views a[data-v=${v}]`)?.remove();
}
const aed = (n) => !n ? "0" : n >= 1e6 ? `${(n / 1e6).toFixed(2).replace(/\.?0+$/, "")}M` : `${Math.round(n / 1000)}k`;
const ago = (iso) => { const m = (Date.now() - new Date(iso)) / 6e4; return m < 1 ? "just now" : m < 60 ? `${Math.round(m)} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const st = ([s, t]) => h("span", { class: `chip ${{ ok: "ok", warn: "warn", bad: "bad" }[s] || ""}` }, t);

// ---------- the three views ----------
const VIEW = () => (["my-work", "deals", "board", "compliance", "finance", "operations"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview");
async function show() {  // a view that can't load says so, never a blank page
  try { await showView(); }
  catch (e) {
    $("view").replaceChildren(h("div", { class: "allclear" }, h("b", {}, "This view didn't load"),
      h("div", {}, `The server didn't answer (${e.message}). It may be restarting.`), h("button", { style: "margin-top:12px", onclick: show }, "Try again")));
  }
}
async function showView() {
  document.querySelectorAll("#views a").forEach((a) => a.classList.toggle("on", a.dataset.v === VIEW()));
  const w = await api(`/api/desk/work?person=${me()}`);
  $("mycount").textContent = w.counts[me()] || "";
  if (VIEW() === "my-work") return myWork(w);
  if (VIEW() === "deals") return deals();
  if (VIEW() === "board") return board();
  if (VIEW() === "compliance") return roomCompliance();
  if (VIEW() === "finance") return roomFinance();
  if (VIEW() === "operations") return roomOperations();
  return overview();
}
addEventListener("hashchange", () => { scrollTo(0, 0); show(); });
const goDeals = (f = "", s = "") => { filter = f; stage = s; page = 1; location.hash === "#deals" ? show() : (location.hash = "#deals"); };
const goWork = (p) => { $("as").value = p; store.set("desk.as", p); group = "all"; location.hash === "#my-work" ? show() : (location.hash = "#my-work"); };

async function overview() {  // the rules panel loads its own data
  const o = await api("/api/desk/overview"), c = o.corrections[0];
  const row = (label, n, onclick) => h("div", { class: `r ${n ? "" : "zero"}`, role: "button", tabindex: n ? 0 : -1, onclick: n ? onclick : null }, h("span", {}, label), h("b", {}, n));
  const tile = (k, big, ...rows) => h("section", { class: "panel tile" }, h("span", { class: "k" }, k), h("span", { class: "big num" }, big), h("div", {}, ...rows));
  $("view").replaceChildren(
    h("p", { class: "lede" }, `${o.deals} deal${o.deals === 1 ? "" : "s"} worth AED ${aed(o.value)} in what customers said. Every number opens the deals or the work behind it; nothing is estimated.`),
    h("div", { class: "story" },
      c ? h("section", { class: "panel correction" }, h("h2", {}, "Latest correction ", h("span", { class: "chip warn" }, `${c.customer} · ${ago(c.at)}`)),
        ...c.old.map((x) => h("div", { class: "was" }, `"${x.quote}"`)), h("div", { class: "now" }, `"${c.quote}"`),
        h("div", { class: "small muted" }, `${c.fact} replaced ${c.old.map((x) => x.id).join(" and ")} · the history is kept`),
        h("div", { class: "ripple" },
          h("div", { class: c.compliance_first ? "first" : "" }, h("b", {}, c.compliance_first ? "1st" : "—"), h("span", {}, "Compliance told, before anyone acted")),
          h("div", {}, h("b", {}, c.withdrawn), h("span", {}, c.withdrawn === 1 ? "task withdrawn" : "tasks withdrawn")), h("div", {}, h("b", {}, c.approvals), h("span", {}, c.approvals === 1 ? "approval back to its approver" : "approvals back to their approver")),
          h("div", {}, h("b", {}, c.sent_back), h("span", {}, c.sent_back === 1 ? "draft sent back" : "drafts sent back"))),
        h("button", { class: "primary", onclick: () => open(c.deal) }, `Open ${c.customer.split(" ")[0]}'s deal`))

function moneyChart(days) {
  const W = 640, H = 200, L = 46, B = 24, T = 10, today = days[4].day, max = Math.max(...days.map((d) => d.aed), 1);
  const step = [50e3, 100e3, 250e3, 500e3, 1e6, 2.5e6, 5e6].find((s) => s * 4 >= max) || 1e7, top = step * 4, bw = (W - L - 6) / days.length;
  const y = (v) => H - B - (v / top) * (H - B - T), ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", "100%");
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Money expected per day");
  const el = (tag, a, text) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (text != null) e.textContent = text; svg.append(e); return e; };
  for (let v = 0; v <= top; v += step) { el("line", { x1: L, x2: W - 4, y1: y(v), y2: y(v), stroke: "rgba(255,255,255,.06)" }); el("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, aed(v)); }
  days.forEach((d, i) => {
    const x = L + i * bw + 3, past = d.day < today;
    if (d.day === today) el("rect", { x: x - 3, y: T, width: bw, height: H - B - T, fill: "rgba(255,255,255,.05)" });
    if (d.aed) el("rect", { x, y: y(d.aed), width: bw - 6, height: H - B - y(d.aed), rx: 3, fill: past ? "var(--bad)" : "var(--gold)" }).append(Object.assign(document.createElementNS(ns, "title"), { textContent: `${d.day}: AED ${d.aed.toLocaleString()}` }));
    if (i % 2 === 0) el("text", { x: x + (bw - 6) / 2, y: H - 7, "text-anchor": "middle" }, d.day === today ? "today" : +d.day.slice(8));
  });
  if (!days.some((d) => d.aed)) el("text", { x: W / 2, y: H / 2, "text-anchor": "middle" }, "No payments promised in these days");
  return svg;
}

async function upload(tid, file, form = false) {
  if (!file) throw new Error("Choose the signed PDF first.");
  if (!window.confirm("Did you check every signature line on it? A PDF can't show that by itself.")) throw new Error("Not uploaded.");
  const fd = new FormData(); fd.append("by", me()); fd.append("file", file); fd.append("checked", "1");
  const r = await fetch(form ? `/api/desk/forms/${tid}/signed` : `/api/desk/tasks/${tid}/signed`, { method: "POST", body: fd });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || `${r.status}`);
  return j;
}
